<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINOBI DATA v1.18.0 | DYNAMIC ISLAND PRO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <style>
        :root {
            --primary: #ff5e00;
            --gold-gradient: linear-gradient(135deg, #ff9a00 0%, #ffcc00 50%, #ff9a00 100%);
            --sky-blue: #00a2ff;
            --bg-dark: #060b13;
            --island-bg: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Bebas Neue', cursive; letter-spacing: 1.5px; }

        body { 
            background-color: var(--bg-dark); 
            color: #fff; 
            min-height: 100vh;
            background: 
                linear-gradient(rgba(6, 11, 19, 0.8), rgba(6, 11, 19, 0.95)),
                url('https://copilot.microsoft.com/th/id/BCO.f03d4abf-cf53-4d80-bf30-9efc53a2bb81.png');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        /* SHINOBI DYNAMIC ISLAND (LIVE NOTIF) */
        #dynamic-island {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px; /* Initial width */
            height: 35px;
            background: var(--island-bg);
            border-radius: 30px;
            z-index: 10002;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        #dynamic-island.active {
            width: 90%;
            max-width: 400px;
            height: 80px;
            border-radius: 20px;
            padding: 15px;
        }

        .island-content { display: flex; align-items: center; width: 100%; gap: 12px; }
        .island-icon { font-size: 1.2rem; min-width: 25px; }
        .island-info { flex: 1; display: none; }
        #dynamic-island.active .island-info { display: block; }
        
        .island-title { font-size: 0.9rem; color: var(--sky-blue); display: flex; justify-content: space-between; }
        .island-bar-bg { width: 100%; height: 6px; background: #222; border-radius: 10px; margin-top: 5px; overflow: hidden; }
        #island-progress { width: 0%; height: 100%; background: var(--primary); transition: 0.3s; }

        .quick-upload-btn {
            background: var(--gold-gradient);
            color: #000;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.2rem;
            border: none;
        }

        /* PREMIUM GOLD BOX v1.18.0 */
        .premium-box {
            background: var(--gold-gradient);
            padding: 8px 20px;
            border-radius: 8px;
            color: #000;
            display: inline-flex;
            align-items: center;
            font-size: 1.2rem;
            box-shadow: 0 0 25px rgba(255, 154, 0, 0.4);
            border: 2px solid #fff;
            transform: perspective(500px) rotateX(10deg);
            animation: float 3s infinite ease-in-out;
        }
        @keyframes float { 0%, 100% { transform: perspective(500px) rotateX(10deg) translateY(0); } 50% { transform: perspective(500px) rotateX(10deg) translateY(-5px); } }

        /* BUTTONS */
        .cute-btn {
            background: var(--sky-blue);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            font-size: 1.3rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 0px #0077bb;
        }
        .cute-btn::after {
            content: ''; position: absolute; top: -50%; left: -150%; width: 50%; height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: rotate(25deg); animation: shine 3s infinite;
        }
        @keyframes shine { 0% { left: -150%; } 20% { left: 150%; } 100% { left: 150%; } }

        /* LAYOUT */
        header { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        .main-container { display: grid; grid-template-columns: 350px 1fr; gap: 30px; padding: 40px 5%; }
        
        .side-bar { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border-radius: 30px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); height: fit-content; position: sticky; top: 100px; }
        .clock-display { font-size: 3.5rem; color: var(--primary); text-align: center; margin-bottom: 20px; }

        .cat-pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; justify-content: center; }
        .pill { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 8px 15px; border-radius: 12px; cursor: pointer; font-size: 1rem; }
        .pill.active { background: #fff; color: #000; }

        .upload-card { background: rgba(0, 162, 255, 0.05); border: 3px dashed var(--sky-blue); border-radius: 40px; padding: 50px 20px; text-align: center; cursor: pointer; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 30px; }
        .item-card { background: #fff; color: #000; border-radius: 20px; padding: 10px; transition: 0.3s; }
        .item-img { width: 100%; height: 160px; border-radius: 15px; object-fit: cover; }
        
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; display: none; justify-content: center; align-items: center; }
        #modal img { max-width: 90%; max-height: 80vh; border-radius: 20px; border: 5px solid #fff; }

        @media (max-width: 1000px) { .main-container { grid-template-columns: 1fr; } .side-bar { position: relative; top: 0; } }
    </style>
</head>
<body>

    <!-- SHINOBI DYNAMIC ISLAND -->
    <div id="dynamic-island">
        <div class="island-content">
            <div class="island-icon">🥷</div>
            <div class="island-info">
                <div class="island-title">
                    <span id="island-status">LIVE SYSTEM</span>
                    <span id="island-percent">0%</span>
                </div>
                <div class="island-bar-bg">
                    <div id="island-progress"></div>
                </div>
            </div>
            <!-- Quick Upload Trigger from Notification -->
            <button class="quick-upload-btn" onclick="document.getElementById('f-input').click()">+</button>
        </div>
    </div>

    <div id="modal" onclick="this.style.display='none'">
        <img id="modal-img" src="">
    </div>

    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div style="font-size: 2.2rem;">SHINOBI DATA</div>
            <div class="premium-box">v1.18.0 PRO</div>
        </div>
        <div id="auth-box">
            <button id="login-btn" class="cute-btn" style="background:#ff9100; box-shadow: 0 8px 0 #cc7400;">GOOGLE LOGIN</button>
            <button id="logout-btn" class="cute-btn" style="display:none; background:#444; box-shadow: 0 8px 0 #222;">LOGOUT</button>
        </div>
    </header>

    <div class="main-container">
        <aside>
            <div class="side-bar">
                <div id="day-now" style="font-size: 1.8rem; text-align: center; color: var(--sky-blue);">DAY</div>
                <div id="clock-now" class="clock-display">00:00:00 AM</div>
                
                <div style="text-align:center;">
                    <p>PILIH KATEGORI</p>
                    <div class="cat-pills">
                        <button class="pill active" onclick="setCat('Resit', this)">RESIT</button>
                        <button class="pill" onclick="setCat('Logistik', this)">LOGISTIK</button>
                        <button class="pill" onclick="setCat('Minyak', this)">MINYAK</button>
                        <button class="pill" onclick="setCat('Lain', this)">LAIN</button>
                    </div>
                </div>

                <div style="background:rgba(255,255,255,0.1); border-radius:20px; padding:20px; text-align:center; margin-top:20px;">
                    <p style="opacity:0.6;">DATABASE TOTAL</p>
                    <h2 id="stat-count" style="font-size:3.5rem; color:var(--sky-blue);">0</h2>
                </div>
            </div>
        </aside>

        <main>
            <div class="upload-card" onclick="document.getElementById('f-input').click()">
                <div style="font-size: 2.5rem;">✦ SIMPAN ARKIB ✦</div>
                <p style="color: var(--sky-blue);">TEKAN UNTUK PILIH FAIL (HEIC/JPG/PNG)</p>
                <input type="file" id="f-input" hidden accept="image/*,.heic,.pdf">
            </div>

            <div class="gallery" id="data-grid"></div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://wacziigqqdmfhkrycdrf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhY3ppaWdxcWRtZmhrcnljZHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNzczNTIsImV4cCI6MjA5Mjk1MzM1Mn0.TD39LvuYkM8IZF6YUDNo-LYtfIFMPrxniy_cnHnHu8A';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentCat = "Resit";

        // --- DYNAMIC ISLAND ENGINE ---
        function updateIsland(active, percent, status) {
            const island = document.getElementById('dynamic-island');
            const bar = document.getElementById('island-progress');
            const txtPercent = document.getElementById('island-percent');
            const txtStatus = document.getElementById('island-status');

            if(active) {
                island.classList.add('active');
                bar.style.width = percent + '%';
                txtPercent.innerText = percent + '%';
                txtStatus.innerText = status;
            } else {
                setTimeout(() => {
                    island.classList.remove('active');
                }, 2000);
            }
        }

        // --- AUTH ---
        async function initAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) handleIn(session.user);
            _supabase.auth.onAuthStateChange((_, s) => { if(s) handleIn(s.user); else handleOut(); });
            if (window.location.hash) window.history.replaceState(null, null, window.location.pathname);
        }

        function handleIn(user) {
            currentUser = user;
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'block';
            fetchData();
        }

        function handleOut() {
            currentUser = null;
            document.getElementById('login-btn').style.display = 'block';
            document.getElementById('logout-btn').style.display = 'none';
            document.getElementById('data-grid').innerHTML = '';
        }

        document.getElementById('login-btn').onclick = () => _supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
        document.getElementById('logout-btn').onclick = () => _supabase.auth.signOut();

        function setCat(c, btn) {
            currentCat = c;
            document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // --- REALTIME CLOCK ---
        function clock() {
            const now = new Date();
            const days = ["AHAD", "ISNIN", "SELASA", "RABU", "KHAMIS", "JUMAAT", "SABTU"];
            document.getElementById('day-now').innerText = days[now.getDay()];
            document.getElementById('clock-now').innerText = now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).toUpperCase();
        }
        setInterval(clock, 1000); clock();

        // --- UPLOAD LOGIC ---
        document.getElementById('f-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file || !currentUser) return;
            try {
                updateIsland(true, 10, "MEMBACA FAIL...");
                let uploadFile = file;
                let fileName = file.name;

                if (fileName.toLowerCase().endsWith('.heic')) {
                    updateIsland(true, 30, "CONVERTING HEIC...");
                    const blob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.5 });
                    uploadFile = Array.isArray(blob) ? blob[0] : blob;
                    fileName = fileName.replace(/\.[^/.]+$/, ".jpg");
                }

                updateIsland(true, 60, "OPTIMIZING...");
                const base64 = await resizeImg(uploadFile);

                updateIsland(true, 85, "UPLOADING...");
                const { error } = await _supabase.from('uploads').insert([{ user_id: currentUser.id, category: currentCat, image_url: base64, file_name: fileName }]);
                if (error) throw error;

                updateIsland(true, 100, "SELESAI!");
                fetchData();
            } catch (err) { updateIsland(true, 100, "ERROR!"); }
            finally { updateIsland(false, 0, ""); }
        };

        function resizeImg(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > 1000) { h *= 1000 / w; w = 1000; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function fetchData() {
            if (!currentUser) return;
            const { data, error } = await _supabase.from('uploads').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            if (error) return;
            document.getElementById('stat-count').innerText = data.length;
            const grid = document.getElementById('data-grid');
            grid.innerHTML = data.map(item => `
                <div class="item-card">
                    <img src="${item.image_url}" class="item-img" onclick="view('${item.image_url}')">
                    <div style="padding:5px; text-align:center;">
                        <div style="color:var(--sky-blue); font-size:0.7rem;">${item.category}</div>
                        <div style="font-size:1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.file_name}</div>
                        <button style="width:100%; color:red; border:none; background:none; cursor:pointer;" onclick="del('${item.id}')">PADAM</button>
                    </div>
                </div>
            `).join('');
        }

        async function del(id) {
            if (confirm("Padam data?")) { await _supabase.from('uploads').delete().match({ id, user_id: currentUser.id }); fetchData(); }
        }

        function view(u) { document.getElementById('modal-img').src = u; document.getElementById('modal').style.display = 'flex'; }
        initAuth();
    </script>
</body>
</html>
