<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHINOBI DATA | AERO CLOUD v17.0</title>
    
    <link id="dynamic-favicon" rel="icon" type="image/png" href="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/bundle.js"></script>

    <style>
        :root {
            --sky-blue: #4faef1;
            --accent-blue: #0ea5e9;
            --accent-purple: #8b5cf6;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --text-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.7);
        }

        /* BESARKAN TULISAN SECARA GLOBAL */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Bebas Neue', cursive !important; 
            letter-spacing: 1.5px;
        }

        body { 
            background: var(--sky-blue); color: var(--text-dark); 
            min-height: 100vh; overflow-x: hidden; position: relative;
            font-size: 1.4rem; /* Tulisan lebih besar */
        }

        /* ANIMATED BACKGROUND */
        .sky-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: linear-gradient(to bottom, #4faef1 0%, #cae9ff 100%); }
        .cloud { position: absolute; background: white; border-radius: 100px; opacity: 0.6; filter: blur(40px); animation: drift linear infinite; z-index: -1; }
        .c1 { width: 500px; height: 150px; top: 10%; left: -500px; animation-duration: 80s; }
        @keyframes drift { from { transform: translateX(-100px); } to { transform: translateX(calc(100vw + 600px)); } }

        /* HEADER RESPONSIVE & BESAR */
        header { 
            margin: 15px; padding: 15px 30px; 
            background: var(--glass); backdrop-filter: blur(25px); 
            border: 2px solid var(--glass-border); border-radius: 100px; 
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 15px; z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            gap: 15px;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .shinobi-box { background: #fff; padding: 8px 25px; border-radius: 15px; border: 2px solid var(--accent-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .shinobi-box h1 { font-size: 2.2rem; color: var(--accent-blue); line-height: 1; }

        .clock-box { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.6); padding: 8px 25px; border-radius: 50px; border: 1px solid #fff; }
        #live-masa { font-family: 'JetBrains Mono', monospace !important; font-weight: bold; color: var(--text-dark); font-size: 1.6rem; }

        /* PROFILE HUD */
        .profile-hub { display: flex; align-items: center; background: #fff; border-radius: 100px; padding: 4px; width: 60px; overflow: hidden; transition: 0.5s; border: 2px solid var(--accent-blue); cursor: pointer; }
        .profile-hub.expanded { width: 250px; padding-right: 20px; }
        .avatar { width: 48px; height: 48px; background: var(--accent-blue); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; }

        /* MAIN CONTAINER LAYOUT */
        .main-container { 
            display: grid; grid-template-columns: 360px 1fr; 
            gap: 25px; padding: 20px; max-width: 1600px; margin: 0 auto;
        }

        /* SYNC CLOUD - NOMBOR 1 */
        .sync-section { 
            background: var(--accent-blue); color: white; padding: 25px; 
            border-radius: 30px; text-align: center; cursor: pointer; 
            box-shadow: 0 12px 30px rgba(14, 165, 233, 0.4); margin-bottom: 25px;
            transition: 0.3s; border: 3px solid rgba(255,255,255,0.3);
        }
        .sync-section:hover { transform: scale(1.02); background: #0284c7; }
        .sync-section h2 { font-size: 2.5rem; text-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        #progress-bar-container { width: 100%; height: 12px; background: rgba(0,0,0,0.2); border-radius: 10px; margin-top: 15px; display: none; overflow: hidden; }
        #progress-bar-fill { height: 100%; background: #fff; width: 0%; transition: 0.3s; }

        /* GLASS PANELS */
        .glass-panel { background: var(--glass); backdrop-filter: blur(20px); border: 2px solid var(--glass-border); border-radius: 40px; padding: 25px; margin-bottom: 25px; }

        /* NAV TABS RESPONSIVE */
        .nav-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 5px 0 15px 0; scrollbar-width: none; }
        .nav-scroll::-webkit-scrollbar { display: none; }
        .nav-item { 
            white-space: nowrap; padding: 12px 30px; background: #fff; 
            border-radius: 100px; font-size: 1.6rem; color: var(--text-dark);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; border: 2px solid transparent;
            transition: 0.3s;
        }
        .nav-item.active { background: var(--accent-blue); color: #fff; border-color: #fff; }

        /* PRAYER TIMES & UTILS */
        .util-row { display: flex; justify-content: space-between; font-size: 1.4rem; padding: 10px 0; border-bottom: 1.5px solid rgba(0,0,0,0.05); }
        .util-title { font-size: 1.8rem; color: var(--accent-blue); margin-bottom: 15px; border-bottom: 2px solid var(--accent-blue); display: inline-block; }

        /* DATA GRID */
        .grid-data { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .data-card { background: #fff; border-radius: 35px; padding: 15px; border: 2px solid var(--glass-border); transition: 0.3s; text-align: center; }
        .data-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .data-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 25px; margin-bottom: 10px; cursor: pointer; }
        .btn-del { width: 100%; background: #ff4e50; color: #fff; border: none; padding: 10px; border-radius: 15px; font-size: 1.3rem; cursor: pointer; }

        /* RESPONSIVE BREAKPOINTS */
        @media (max-width: 1024px) {
            .main-container { grid-template-columns: 1fr; }
            header { padding: 10px 20px; border-radius: 30px; }
            .shinobi-box h1 { font-size: 1.5rem; }
            #live-masa { font-size: 1.2rem; }
            .nav-item { padding: 10px 20px; font-size: 1.3rem; }
            .sync-section h2 { font-size: 2rem; }
        }

        @media (max-width: 480px) {
            header { flex-direction: column; gap: 8px; border-radius: 20px; }
            .clock-box { width: 100%; justify-content: center; }
            .grid-data { grid-template-columns: 1fr; }
            .data-card img { height: 300px; }
        }
    </style>
</head>
<body>

    <div class="sky-bg"></div>
    <div class="cloud c1"></div>

    <header>
        <div class="header-left">
            <div class="shinobi-box"><h1>SHINOBI CLOUD</h1></div>
            <div class="clock-box">
                <span id="live-hari">...</span>
                <span id="live-masa">00:00:00</span>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <button id="login-btn" style="background:#fff; border:2px solid #ddd; padding:10px 25px; border-radius:100px; font-size:1.2rem; cursor:pointer;" onclick="login()">LOGIN</button>
            <div id="profile-hub" class="profile-hub" onclick="toggleProfile()">
                <div class="avatar" id="avatar-initial">?</div>
                <div style="margin-left:15px; white-space:nowrap; overflow:hidden;">
                    <div id="user-name" style="font-size:1.4rem;">USER</div>
                    <button style="background:none; border:none; color:red; font-size:1rem;" onclick="logout()">KELUAR</button>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- SIDEBAR (WAKTU SOLAT & UTILS) -->
        <aside>
            <!-- NOMBOR 2: WAKTU SOLAT -->
            <div class="glass-panel">
                <div class="util-title">🕌 WAKTU SOLAT</div>
                <div id="prayer-list">
                    <div class="util-row"><span>Subuh</span> <span id="p-fajr">-</span></div>
                    <div class="util-row"><span>Zohor</span> <span id="p-dhuhr">-</span></div>
                    <div class="util-row"><span>Asar</span> <span id="p-asr">-</span></div>
                    <div class="util-row"><span>Maghrib</span> <span id="p-maghrib">-</span></div>
                    <div class="util-row"><span>Isyak</span> <span id="p-isha">-</span></div>
                </div>
            </div>

            <!-- NOMBOR 3: UTILITIES -->
            <div class="glass-panel">
                <div class="util-title">🛠️ UTILITIES</div>
                <div style="text-align: center;">
                    <div style="font-size:1rem; opacity:0.7;">LANGKAH GPS</div>
                    <div id="display-steps" style="font-size:4rem; color:var(--accent-green); line-height: 1;">0</div>
                    <button style="width:100%; padding:12px; background:var(--accent-blue); color:#fff; border:none; border-radius:15px; font-size:1.4rem; margin-top:10px;" onclick="toggleGPS()">MULA TRACKING</button>
                </div>

                <div style="margin-top:20px; background:white; padding:15px; border-radius:20px; text-align:center;">
                    <div style="font-size:1rem;">HARGA MINYAK RON95</div>
                    <div style="font-size:2rem; color:var(--accent-gold);">RM 2.05</div>
                </div>
            </div>
        </aside>

        <!-- MAIN AREA (SYNC & DATA) -->
        <main>
            <!-- NOMBOR 1: SYNC CLOUD -->
            <div class="sync-section" onclick="document.getElementById('f-input').click()">
                <h2 id="sync-text">✦ SYNC CLOUD <span id="percent-val"></span> ✦</h2>
                <div id="progress-bar-container"><div id="progress-bar-fill"></div></div>
            </div>

            <div class="nav-scroll">
                <div class="nav-item active" onclick="setCat('Resit', this)">📜 RESIT</div>
                <div class="nav-item" onclick="setCat('Logistik', this)">🚛 LOGISTIK</div>
                <div class="nav-item" onclick="setCat('Minyak', this)">⛽ MINYAK</div>
                <div class="nav-item" style="color:var(--accent-gold); border-color:var(--accent-gold);" onclick="setCat('Global', this)">🌎 COMMUNITY</div>
            </div>

            <input type="file" id="f-input" hidden accept="image/*,.heic">
            <div id="data-grid" class="grid-data"></div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://wacziigqqdmfhkrycdrf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhY3ppaWdxcWRtZmhrcnljZHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNzczNTIsImV4cCI6MjA5Mjk1MzM1Mn0.TD39LvuYkM8IZF6YUDNo-LYtfIFMPrxniy_cnHnHu8A';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null, currentCat = "Resit", totalDist = 0, lastCoords = null, watchId = null;

        // --- FAVICON & PROGRESS ---
        function updateFavicon(progress = 0, status = 'idle') {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = status === 'success' ? '#10b981' : (status === 'processing' ? '#8b5cf6' : '#0ea5e9');
            ctx.beginPath(); ctx.arc(16, 16, 14, 0, Math.PI * 2); ctx.fill();
            if (progress > 0) {
                ctx.fillStyle = "#fff"; ctx.font = "bold 12px Arial"; ctx.textAlign = "center";
                ctx.fillText(progress + "%", 16, 21);
            }
            document.getElementById('dynamic-favicon').href = canvas.toDataURL('image/png');
        }

        function updateProg(v) {
            const bar = document.getElementById('progress-bar-fill');
            const cont = document.getElementById('progress-bar-container');
            const txt = document.getElementById('percent-val');
            cont.style.display = 'block'; bar.style.width = v + '%'; txt.innerText = `(${v}%)`;
            updateFavicon(v, v < 100 ? 'processing' : 'success');
            if(v >= 100) setTimeout(() => { cont.style.display = 'none'; txt.innerText = ''; updateFavicon(0, 'idle'); }, 3000);
        }

        // --- CLOCK ---
        function updateClock() {
            const now = new Date();
            const hari = ["AHAD", "ISNIN", "SELASA", "RABU", "KHAMIS", "JUMAAT", "SABTU"];
            document.getElementById('live-hari').innerText = hari[now.getDay()];
            document.getElementById('live-masa').innerText = now.toLocaleTimeString('ms-MY', { hour12: false });
        }
        setInterval(updateClock, 1000);

        // --- UPLOAD ---
        document.getElementById('f-input').onchange = async (e) => {
            const file = e.target.files[0]; if (!file || !currentUser) return;
            try {
                updateProg(20);
                let upFile = file;
                if (file.name.toLowerCase().endsWith('.heic')) {
                    const blob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.6 });
                    upFile = blob[0] || blob;
                }
                updateProg(60);
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const img = new Image();
                    img.onload = async () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 1000; canvas.height = (1000 / img.width) * img.height;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        await _supabase.from('uploads').insert([{ 
                            user_id: currentUser.id, category: currentCat, 
                            image_url: canvas.toDataURL('image/png', 0.7), file_name: file.name
                        }]);
                        updateProg(100); fetchData();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(upFile);
            } catch (err) { updateFavicon(0, 'idle'); alert("Ralat."); }
        };

        // --- AUTH & DATA ---
        async function fetchData() {
            if (!currentUser) return;
            const { data } = await _supabase.from('uploads').select('*').eq('user_id', currentUser.id).eq('category', currentCat).order('created_at', { ascending: false });
            document.getElementById('data-grid').innerHTML = data.map(item => `
                <div class="data-card">
                    <img src="${item.image_url}" onclick="window.open('${item.image_url}')">
                    <div style="font-size:1.2rem; margin-bottom:10px;">${item.file_name.substring(0,15)}...</div>
                    <button class="btn-del" onclick="del('${item.id}')">PADAM</button>
                </div>
            `).join('');
        }

        async function initAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) handleIn(session.user);
            _supabase.auth.onAuthStateChange((_, s) => { if(s) handleIn(s.user); else handleOut(); });
        }

        function handleIn(user) {
            currentUser = user;
            document.getElementById('login-btn').style.display='none';
            document.getElementById('profile-hub').style.display='flex';
            document.getElementById('user-name').innerText = user.user_metadata.full_name.split(' ')[0];
            document.getElementById('avatar-initial').innerText = user.user_metadata.full_name[0];
            fetchData();
        }

        function handleOut() { currentUser = null; document.getElementById('login-btn').style.display='block'; document.getElementById('profile-hub').style.display='none'; }
        function login() { _supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } }); }
        function logout() { _supabase.auth.signOut(); }
        function toggleProfile() { document.getElementById('profile-hub').classList.toggle('expanded'); }
        function setCat(c, btn) { 
            currentCat = c; 
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); 
            btn.classList.add('active'); fetchData(); 
        }
        function del(id) { if(confirm("Padam?")) { _supabase.from('uploads').delete().match({id}).then(() => fetchData()); } }

        // --- PRAYER ---
        async function fetchPrayer() {
            const res = await fetch("https://api.azanpro.com/times/today.json?zone=sgr01&format=12");
            const data = await res.json();
            const d = data.results;
            document.getElementById('p-fajr').innerText = d.fajr;
            document.getElementById('p-dhuhr').innerText = d.dhuhr;
            document.getElementById('p-asr').innerText = d.asr;
            document.getElementById('p-maghrib').innerText = d.maghrib;
            document.getElementById('p-isha').innerText = d.isha;
        }

        // --- GPS ---
        function toggleGPS() {
            if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            else {
                watchId = navigator.geolocation.watchPosition(pos => {
                    const { latitude: lat, longitude: lng } = pos.coords;
                    if (lastCoords) {
                        const R = 6371; const dLat = (lat-lastCoords.lat)*Math.PI/180;
                        const d = R * 2 * Math.atan2(Math.sqrt(Math.sin(dLat/2)**2), 1);
                        if(d > 0.001) totalDist += d;
                        document.getElementById('display-steps').innerText = Math.floor(totalDist * 1312);
                    }
                    lastCoords = { lat, lng };
                });
            }
        }

        updateFavicon(0, 'idle');
        initAuth();
        updateClock();
        fetchPrayer();
    </script>
</body>
</html>
