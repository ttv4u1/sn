<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINOBI DATA v1.10.0 | PROGRESSIVE ENGINE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <style>
        :root {
            --primary: #ff2d55;
            --accent: #ffb700;
            --white: #ffffff;
            --bg-dark: #08080a;
            --glass: rgba(255, 255, 255, 0.05);
            --glow-red: 0 0 15px rgba(255, 45, 85, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Bebas Neue', cursive; letter-spacing: 1px; }
        body { background-color: var(--bg-dark); color: var(--white); overflow-x: hidden; min-height: 100vh; }

        /* Background */
        .animated-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #1a0005 0%, #000 100%); }
        .anime-overlay { position: absolute; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=1920') no-repeat center center; background-size: cover; opacity: 0.05; }

        header { position: sticky; top: 0; z-index: 1000; background: rgba(8, 8, 10, 0.9); backdrop-filter: blur(15px); border-bottom: 2px solid var(--primary); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 2rem; color: var(--primary); text-shadow: var(--glow-red); }

        .btn-aura { padding: 10px 25px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; transition: 0.3s; font-size: 1.1rem; box-shadow: var(--glow-red); }
        .btn-secondary { background: #222; box-shadow: none; border: 1px solid #444; }
        .hidden { display: none !important; }

        .main-container { padding: 25px 5%; display: grid; grid-template-columns: 300px 1fr; gap: 25px; }
        .side-panel { background: var(--glass); padding: 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); height: fit-content; position: sticky; top: 100px; }

        .clock-box { text-align: center; padding: 20px; border: 2px solid var(--accent); background: rgba(0,0,0,0.5); margin-bottom: 20px; clip-path: polygon(0 15%, 15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%); }
        #clock-time { font-size: 3.5rem; color: var(--accent); }

        .upload-section { background: var(--glass); padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .cat-btn { background: #111; border: 1px solid var(--primary); color: white; padding: 12px; cursor: pointer; transition: 0.3s; font-family: 'Rajdhani'; font-weight: bold; }
        .cat-btn.active { background: var(--primary); box-shadow: var(--glow-red); }

        .drop-zone { border: 2px dashed #333; padding: 50px 20px; text-align: center; border-radius: 10px; transition: 0.3s; cursor: pointer; background: rgba(255,255,255,0.02); }
        .drop-zone:hover { border-color: var(--primary); background: rgba(255,45,85,0.05); }

        /* PROGRESS OVERLAY SYSTEM */
        #loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; }
        .progress-box { width: 300px; text-align: center; }
        .progress-circle { position: relative; width: 120px; height: 120px; margin: 0 auto 20px; }
        .progress-num { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.2rem; color: var(--accent); }
        .spinner { width: 100%; height: 100%; border: 8px solid #222; border-top: 8px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        
        .progress-bar-wrap { width: 100%; height: 6px; background: #222; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        #progress-bar-fill { width: 0%; height: 100%; background: var(--primary); box-shadow: var(--glow-red); transition: 0.3s; }
        #status-text { font-family: 'Rajdhani'; color: #aaa; margin-top: 10px; font-size: 1rem; text-transform: uppercase; }

        /* DATA GRID */
        .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 30px; }
        .item-card { background: #111; border: 1px solid #222; padding: 8px; border-radius: 8px; transition: 0.3s; }
        .item-card:hover { border-color: var(--primary); transform: translateY(-3px); }
        .img-wrap { width: 100%; height: 140px; overflow: hidden; border-radius: 4px; cursor: zoom-in; background: #000; display: flex; align-items: center; justify-content: center; }
        .img-wrap img { width: 100%; height: 100%; object-fit: cover; }

        .card-meta { padding: 8px 0; font-family: 'Rajdhani'; }
        .meta-cat { color: var(--accent); font-size: 0.7rem; font-weight: bold; }
        .meta-name { font-size: 0.8rem; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .actions { display: flex; gap: 5px; margin-top: 8px; }
        .btn-sm { flex: 1; padding: 6px; font-size: 0.75rem; border: none; cursor: pointer; color: white; border-radius: 3px; font-family: 'Rajdhani'; font-weight: bold; }
        .btn-v { background: #333; }
        .btn-d { background: #500; }

        /* Lightbox */
        #modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.98); z-index: 10000; display: none; justify-content: center; align-items: center; }
        #modal-img { max-width: 95%; max-height: 90vh; border: 1px solid #333; }
        .close-m { position: absolute; top: 20px; right: 30px; font-size: 3rem; color: #fff; cursor: pointer; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 768px) { .main-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="animated-bg"><div class="anime-overlay"></div></div>

    <!-- Lightbox -->
    <div id="modal" onclick="closeM()"><span class="close-m">&times;</span><img id="modal-img" src=""></div>

    <!-- Progress Overlay -->
    <div id="loading-overlay">
        <div class="progress-box">
            <div class="progress-circle">
                <div class="spinner"></div>
                <div class="progress-num"><span id="p-num">0</span>%</div>
            </div>
            <div id="status-text">INITIALIZING...</div>
            <div class="progress-bar-wrap">
                <div id="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <header>
        <div class="logo">✦ SHINOBI DATA <span style="font-size: 0.8rem; opacity: 0.5;">v1.10.0</span></div>
        <div class="auth-wrap">
            <button id="login-btn" class="btn-aura">GOOGLE LOGIN</button>
            <button id="logout-btn" class="btn-aura btn-secondary hidden">KELUAR</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="side-panel">
            <div class="clock-box"><div id="clock-time">00:00</div></div>
            <div style="background: rgba(255,45,85,0.1); padding: 15px; border-left: 3px solid var(--primary);">
                <h4 style="font-family: Rajdhani; font-size: 0.8rem; color: #888;">TOTAL DATABASE</h4>
                <div id="stat-count" style="font-size: 2rem;">0</div>
            </div>
        </aside>

        <main class="upload-section">
            <div class="category-grid">
                <button class="cat-btn active" onclick="setCat('Resit', this)">RESIT</button>
                <button class="cat-btn" onclick="setCat('Logistik', this)">LOGISTIK</button>
                <button class="cat-btn" onclick="setCat('Kad Minyak', this)">KAD MINYAK</button>
                <button class="cat-btn" onclick="setCat('Lain-lain', this)">LAIN-LAIN</button>
            </div>

            <div class="drop-zone" onclick="document.getElementById('f-input').click()">
                <p style="font-family: Rajdhani; font-weight: bold; color: var(--accent);">TAP TO UPLOAD</p>
                <p style="font-size: 0.7rem; opacity: 0.5; margin-top: 5px;">SUPPORT: HEIC, JPG, PNG, PDF</p>
                <input type="file" id="f-input" hidden accept="image/*,.heic,.pdf">
            </div>

            <div class="data-grid" id="data-grid"></div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://wacziigqqdmfhkrycdrf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhY3ppaWdxcWRtZmhrcnljZHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNzczNTIsImV4cCI6MjA5Mjk1MzM1Mn0.TD39LvuYkM8IZF6YUDNo-LYtfIFMPrxniy_cnHnHu8A';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentCat = "Resit";

        // --- AUTH ---
        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) handleIn(session.user);
            _supabase.auth.onAuthStateChange((_, s) => { if(s) handleIn(s.user); else handleOut(); });
        }

        function handleIn(u) {
            currentUser = u;
            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            if (window.location.hash) window.history.replaceState(null, null, window.location.pathname);
            fetchItems();
        }

        function handleOut() {
            currentUser = null;
            document.getElementById('login-btn').classList.remove('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
            document.getElementById('data-grid').innerHTML = '';
        }

        document.getElementById('login-btn').onclick = () => _supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
        document.getElementById('logout-btn').onclick = async () => { await _supabase.auth.signOut(); window.location.reload(); };

        // --- UI ---
        function setCat(c, b) {
            currentCat = c;
            document.querySelectorAll('.cat-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
        }

        function setProgress(val, txt) {
            document.getElementById('loading-overlay').style.display = 'flex';
            document.getElementById('p-num').innerText = val;
            document.getElementById('progress-bar-fill').style.width = val + '%';
            document.getElementById('status-text').innerText = txt;
        }

        // --- CORE: PROCESSING & UPLOAD ---
        document.getElementById('f-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file || !currentUser) return;

            try {
                setProgress(10, "READING FILE...");
                let uploadFile = file;
                let fileName = file.name;
                const ext = fileName.split('.').pop().toLowerCase();

                // 1. HEIC CONVERSION
                if (ext === 'heic') {
                    setProgress(30, "CONVERTING HEIC ENGINE...");
                    const blob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.5 });
                    uploadFile = Array.isArray(blob) ? blob[0] : blob;
                    fileName = fileName.replace(/\.[^/.]+$/, ".jpg");
                }

                // 2. RESIZE & COMPRESS (PENTING UNTUK STABILITI)
                setProgress(60, "NEURAL COMPRESSION...");
                const base64 = await processImage(uploadFile);

                // 3. UPLOAD TO SUPABASE
                setProgress(85, "UPLOADING TO SHINOBI CLOUD...");
                const { error } = await _supabase.from('uploads').insert([
                    { user_id: currentUser.id, category: currentCat, image_url: base64, file_name: fileName }
                ]);

                if (error) throw error;

                setProgress(100, "COMPLETE!");
                setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none'; fetchItems(); }, 600);

            } catch (err) {
                console.error(err);
                alert("ERROR: " + err.message);
                document.getElementById('loading-overlay').style.display = 'none';
            }
        };

        // Fungsi mengecilkan dimensi imej (max 1200px)
        function processImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width;
                        let h = img.height;
                        const max = 1200; // Saiz selamat untuk base64

                        if (w > max) { h *= max / w; w = max; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function fetchItems() {
            if (!currentUser) return;
            const { data, error } = await _supabase.from('uploads').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            if (error) return;
            document.getElementById('stat-count').innerText = data.length;
            const grid = document.getElementById('data-grid');
            grid.innerHTML = '';
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="img-wrap" onclick="view('${item.image_url}')">
                        <img src="${item.image_url}" loading="lazy">
                    </div>
                    <div class="card-meta">
                        <div class="meta-cat">${item.category}</div>
                        <div class="meta-name">${item.file_name}</div>
                        <div class="actions">
                            <button class="btn-sm btn-v" onclick="view('${item.image_url}')">VIEW</button>
                            <button class="btn-sm btn-d" onclick="del('${item.id}')">DEL</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function del(id) {
            if (confirm("DELETE PERMANENTLY?")) {
                await _supabase.from('uploads').delete().match({ id: id, user_id: currentUser.id });
                fetchItems();
            }
        }

        function view(u) { document.getElementById('modal-img').src = u; document.getElementById('modal').style.display = 'flex'; }
        function closeM() { document.getElementById('modal').style.display = 'none'; }
        setInterval(() => { document.getElementById('clock-time').innerText = new Date().toLocaleTimeString('ms-MY', { hour12: false }); }, 1000);
        
        checkSession();
    </script>
</body>
</html>
