<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINOBI DATA v1.8.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Library Penukaran & Kompresi HEIC -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <style>
        :root {
            --primary: #ff2d55;
            --accent: #ffb700;
            --white: #ffffff;
            --bg-dark: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.08);
            --glow-red: 0 0 15px rgba(255, 45, 85, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Bebas Neue', cursive; letter-spacing: 1px; }
        body { background-color: var(--bg-dark); color: var(--white); overflow-x: hidden; min-height: 100vh; }

        .animated-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(45deg, #1a0005, #000000, #0d001a); }
        .anime-overlay { position: absolute; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1618336753974-aae8e04506aa?q=80&w=1920') no-repeat center center; background-size: cover; opacity: 0.1; filter: brightness(0.5); }

        header { position: sticky; top: 0; z-index: 1000; background: rgba(10, 10, 12, 0.95); backdrop-filter: blur(15px); border-bottom: 2px solid var(--primary); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 2rem; color: var(--primary); text-shadow: var(--glow-red); }

        .auth-container { display: flex; gap: 10px; }
        .btn-aura { padding: 10px 25px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; transition: 0.3s; font-size: 1.1rem; box-shadow: var(--glow-red); }
        .btn-aura:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--primary); }
        .btn-secondary { background: #333; box-shadow: none; }
        .hidden { display: none !important; }

        .main-container { padding: 30px 5%; display: grid; grid-template-columns: 320px 1fr; gap: 30px; }
        .side-panel { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 25px; border-radius: 15px; height: fit-content; position: sticky; top: 100px; }

        .clock-box { text-align: center; padding: 20px; border: 2px solid var(--accent); background: rgba(0,0,0,0.4); margin-bottom: 25px; clip-path: polygon(0 15%, 15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%); }
        #clock-time { font-size: 3.5rem; color: var(--accent); }

        .stat-card { background: rgba(255, 45, 85, 0.1); padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
        .stat-card h4 { font-family: 'Rajdhani', sans-serif; font-size: 0.9rem; color: #aaa; }
        .stat-card div { font-size: 1.8rem; color: #fff; }

        .upload-section { background: var(--glass); padding: 30px; border-radius: 15px; }
        .category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .cat-btn { background: #1a1a1a; border: 1px solid var(--primary); color: white; padding: 15px; cursor: pointer; transition: 0.3s; }
        .cat-btn.active { background: var(--primary); box-shadow: var(--glow-red); }

        .drop-zone { border: 2px dashed #444; padding: 40px; text-align: center; border-radius: 10px; margin-bottom: 30px; transition: 0.3s; cursor: pointer; position: relative; }
        .drop-zone:hover { border-color: var(--accent); background: rgba(255,183,0,0.05); }
        
        #loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { width: 60px; height: 60px; border: 6px solid #222; border-top: 6px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }

        .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .item-card { background: #111; border: 1px solid #222; padding: 12px; border-radius: 10px; transition: 0.3s; }
        .item-card:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

        .img-container { width: 100%; height: 160px; overflow: hidden; border-radius: 6px; cursor: pointer; background: #000; display: flex; align-items: center; justify-content: center; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .file-icon { font-size: 3rem; }

        .card-info { padding: 10px 0; font-family: 'Rajdhani', sans-serif; }
        .card-category { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; font-weight: bold; }
        .card-name { font-size: 0.9rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
        .card-date { color: #555; font-size: 0.75rem; margin-top: 2px; }

        .actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-sm { flex: 1; padding: 8px; font-size: 0.85rem; border: none; cursor: pointer; color: white; border-radius: 4px; transition: 0.2s; text-align: center; }
        .btn-view { background: #2a2a2a; border: 1px solid #444; }
        .btn-del { background: #400; border: 1px solid #600; }
        .btn-del:hover { background: #ff2d55; }

        #modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.97); z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        #modal-img { max-width: 95%; max-height: 80vh; border: 2px solid #333; display: none; }
        #modal-frame { width: 90vw; height: 80vh; background: white; display: none; border-radius: 8px; }
        .close-modal { position: absolute; top: 20px; right: 30px; font-size: 3rem; color: white; cursor: pointer; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 768px) { .main-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="animated-bg"><div class="anime-overlay"></div></div>

    <!-- Full Screen Loader -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-text" style="margin-top: 20px; font-family: Rajdhani; color: var(--accent); font-weight: bold; font-size: 1.2rem; text-transform: uppercase;">MEMPROSES...</p>
    </div>

    <!-- Lightbox -->
    <div id="modal-overlay">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <img id="modal-img" src="">
        <iframe id="modal-frame"></iframe>
        <div style="margin-top: 15px; text-align: center;">
            <p id="modal-title" style="font-family: Rajdhani; color: var(--accent); margin-bottom: 10px;"></p>
            <button id="modal-dl-btn" class="btn-aura" style="font-size:0.8rem; padding: 10px 20px;">MUAT TURUN FAIL</button>
        </div>
    </div>

    <header>
        <div class="logo">✦ SHINOBI DATA <span style="font-size: 0.8rem; opacity: 0.6;">v1.8.0</span></div>
        <div class="auth-container">
            <button id="login-btn" class="btn-aura">GOOGLE LOGIN</button>
            <button id="logout-btn" class="btn-aura btn-secondary hidden">KELUAR</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="side-panel">
            <div class="clock-box">
                <div id="clock-time">00:00</div>
                <div id="clock-date" style="font-size: 0.9rem; opacity: 0.7;">LOADING...</div>
            </div>
            <div class="stat-card"><h4>JUMLAH REKOD</h4><div id="stat-total">0</div></div>
            <div class="stat-card">
                <h4>SMART COMPRESSION</h4>
                <div style="font-size: 0.75rem; color: var(--accent); line-height: 1.5; font-family: Rajdhani;">
                    Sistem akan menukar fail .HEIC secara automatik ke .JPG yang telah dikompres untuk paparan pantas.
                </div>
            </div>
        </aside>

        <main class="upload-section">
            <h2 style="margin-bottom: 20px; color: var(--primary);">UPLOAD CENTER</h2>
            <div class="category-grid">
                <button class="cat-btn active" onclick="setCategory('Resit', this)">RESIT</button>
                <button class="cat-btn" onclick="setCategory('Kad Minyak', this)">KAD MINYAK</button>
                <button class="cat-btn" onclick="setCategory('Logistik', this)">LOGISTIK</button>
                <button class="cat-btn" onclick="setCategory('Lain-lain', this)">LAIN-LAIN</button>
            </div>

            <div class="drop-zone" onclick="document.getElementById('file-input').click()">
                <p id="upload-status">TAP UNTUK PILIH FAIL (SUPPORT .HEIC IPHONE)</p>
                <input type="file" id="file-input" hidden accept="image/*,.heic,.pdf,.docx,.xlsx">
            </div>

            <div class="data-grid" id="data-grid"></div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://wacziigqqdmfhkrycdrf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhY3ppaWdxcWRtZmhrcnljZHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNzczNTIsImV4cCI6MjA5Mjk1MzM1Mn0.TD39LvuYkM8IZF6YUDNo-LYtfIFMPrxniy_cnHnHu8A';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentCategory = "Resit";

        // --- AUTH ---
        async function initAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) handleLogin(session.user);
            _supabase.auth.onAuthStateChange((event, session) => {
                if (session) handleLogin(session.user); else handleLogout();
            });
        }

        function handleLogin(user) {
            currentUser = user;
            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            if (window.location.hash) window.history.replaceState(null, null, window.location.pathname);
            fetchData();
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('login-btn').classList.remove('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
        }

        document.getElementById('login-btn').onclick = () => _supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
        document.getElementById('logout-btn').onclick = async () => { await _supabase.auth.signOut(); window.location.reload(); };

        // --- UI UTILS ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').innerText = now.toLocaleTimeString('ms-MY', { hour12: false });
            document.getElementById('clock-date').innerText = now.toLocaleDateString('ms-MY', { day:'numeric', month:'long', year:'numeric' }).toUpperCase();
        }
        setInterval(updateClock, 1000); updateClock();

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // --- CORE LOGIC: AUTO-CONVERT & COMPRESS HEIC ---
        document.getElementById('file-input').onchange = async (e) => {
            let file = e.target.files[0];
            if (!file || !currentUser) return;

            const overlay = document.getElementById('loading-overlay');
            const lText = document.getElementById('loading-text');
            overlay.style.display = 'flex';

            try {
                let fileName = file.name;
                let ext = fileName.split('.').pop().toLowerCase();

                // JIKA FAIL ADALAH HEIC (IPHONE)
                if (ext === 'heic') {
                    lText.innerText = "AUTO-CONVERTING & COMPRESSING HEIC...";
                    
                    // Convert & Compress (Quality 0.5 untuk saiz optimal di database)
                    const convertedBlob = await heic2any({
                        blob: file,
                        toType: "image/jpeg",
                        quality: 0.5 
                    });

                    // Ambil blob hasil tukaran
                    const blobToUpload = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                    
                    // Tukar balik kepada File object dengan extension .jpg
                    file = new File([blobToUpload], fileName.replace(/\.[^/.]+$/, ".jpg"), { type: "image/jpeg" });
                    fileName = file.name;
                    console.log("HEIC converted to JPG successfully.");
                }

                lText.innerText = "SAVING TO SHINOBI CLOUD...";
                const reader = new FileReader();
                reader.onload = async (re) => {
                    const { error } = await _supabase.from('uploads').insert([
                        { 
                            user_id: currentUser.id, 
                            category: currentCategory, 
                            image_url: re.target.result, // Base64 JPG
                            file_name: fileName 
                        }
                    ]);
                    overlay.style.display = 'none';
                    if (error) alert("Ralat Upload: " + error.message); else fetchData();
                };
                reader.readAsDataURL(file);

            } catch (err) {
                console.error("HEIC Error:", err);
                overlay.style.display = 'none';
                alert("Fail HEIC terlalu besar atau rosak. Sila cuba lagi.");
            }
        };

        async function fetchData() {
            if (!currentUser) return;
            const { data, error } = await _supabase.from('uploads').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            if (error) return;
            document.getElementById('stat-total').innerText = data.length;
            const grid = document.getElementById('data-grid');
            grid.innerHTML = '';

            data.forEach(item => {
                const ext = item.file_name.split('.').pop().toLowerCase();
                const isImg = ['jpg','jpeg','png','webp','gif'].includes(ext);
                let preview = isImg ? `<img src="${item.image_url}" loading="lazy">` : `<div class="file-icon">${ext === 'pdf' ? '📕' : '📄'}</div>`;

                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="img-container" onclick="viewFile('${item.image_url}', '${item.file_name}')">${preview}</div>
                    <div class="card-info">
                        <div class="card-category">${item.category}</div>
                        <div class="card-name" title="${item.file_name}">${item.file_name}</div>
                        <div class="card-date">${new Date(item.created_at).toLocaleDateString('ms-MY')}</div>
                        <div class="actions">
                            <button class="btn-sm btn-view" onclick="viewFile('${item.image_url}', '${item.file_name}')">LIHAT</button>
                            <button class="btn-sm btn-del" onclick="deleteItem('${item.id}')">PADAM</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function deleteItem(id) {
            if (!confirm("Padam data ini secara kekal?")) return;
            const { error } = await _supabase.from('uploads').delete().match({ id: id, user_id: currentUser.id });
            if (error) alert("Gagal padam."); else fetchData();
        }

        function viewFile(url, name) {
            const ext = name.split('.').pop().toLowerCase();
            const modal = document.getElementById('modal-overlay');
            const mImg = document.getElementById('modal-img');
            const mFrame = document.getElementById('modal-frame');
            document.getElementById('modal-title').innerText = name;
            mImg.style.display = 'none'; mFrame.style.display = 'none'; modal.style.display = 'flex';
            
            document.getElementById('modal-dl-btn').onclick = () => {
                const a = document.createElement('a'); a.href = url; a.download = name; a.click();
            };

            if (['jpg','jpeg','png','webp','gif'].includes(ext)) {
                mImg.src = url; mImg.style.display = 'block';
            } else if (ext === 'pdf') {
                mFrame.src = url; mFrame.style.display = 'block';
            } else {
                alert("Fail dumuat turun secara automatik.");
                document.getElementById('modal-dl-btn').click();
                closeModal();
            }
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('modal-frame').src = "";
        }

        initAuth();
    </script>
</body>
</html>
