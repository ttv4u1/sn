<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHINOBI CLOUD | v25.0 MOBILE PRO</title>
    
    <link id="dynamic-favicon" rel="icon" type="image/png" href="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/bundle.js"></script>

    <style>
        :root {
            --p-blue: #3a91ff;
            --p-yellow: #ffd000;
            --p-red: #ff4757;
            --p-green: #2ed573;
            --p-purple: #a55eea;
            --clay-white: #ffffff;
            --toy-bg: #eef2f7;
            --shadow-3d: 8px 8px 16px #c3cbd9, -8px -8px 16px #ffffff;
            --inner-glow: inset 3px 3px 6px rgba(255,255,255,0.8), inset -3px -3px 6px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Bebas Neue', cursive !important; letter-spacing: 1.2px; -webkit-tap-highlight-color: transparent; }

        body { 
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); 
            color: #2f3542; min-height: 100vh; overflow-x: hidden;
            padding-top: 80px; /* Adjust for fixed header */
        }

        /* --- SMART RESPONSIVE HEADER --- */
        header {
            margin: 0; padding: 10px 15px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            border-bottom: 3px solid var(--p-blue);
            display: flex; align-items: center; justify-content: space-between;
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: transform 0.4s ease;
        }
        header.hide { transform: translateY(-100%); }

        .brand-3d h1 { font-size: 1.5rem; color: var(--p-blue); }

        .clock-container { text-align: center; flex: 1; }
        #live-masa { font-family: 'JetBrains Mono', monospace !important; color: var(--p-red); font-size: 1.1rem; font-weight: bold; }
        #live-hari { font-size: 0.6rem; opacity: 0.6; text-transform: uppercase; }

        /* --- LOGIN & PROFILE COMPACT --- */
        .auth-area { display: flex; align-items: center; gap: 8px; }
        .login-btn-comp { background: #fff; border: 2px solid var(--p-blue); padding: 5px 12px; border-radius: 50px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
        .profile-hub {
            display: flex; align-items: center; background: #fff; border-radius: 50px;
            padding: 3px; width: 42px; overflow: hidden; transition: 0.5s;
            border: 2px solid var(--p-yellow); cursor: pointer;
        }
        .profile-hub.expanded { width: 180px; padding-right: 10px; }
        .profile-pic { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1.5px solid #fff; flex-shrink: 0; }
        .user-meta { opacity: 0; transition: 0.3s; margin-left: 8px; white-space: nowrap; overflow: hidden; font-family: 'Inter', sans-serif !important; letter-spacing: 0; font-size: 0.8rem; }
        .profile-hub.expanded .user-meta { opacity: 1; }

        /* --- MAIN LAYOUT --- */
        .main-container { padding: 15px; max-width: 1200px; margin: 0 auto; }
        
        /* --- CLAY CARDS --- */
        .clay-card { 
            background: #fff; border-radius: 25px; padding: 20px; 
            margin-bottom: 15px; border: 4px solid #fff; 
            box-shadow: var(--shadow-3d); position: relative;
        }
        .section-title { font-size: 1.4rem; color: var(--p-blue); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

        /* --- SYNC BUTTON --- */
        .sync-btn {
            width: 100%; padding: 15px; border-radius: 15px; border: none;
            background: linear-gradient(to bottom, #3a91ff, #1e3799);
            color: #fff; font-size: 1.5rem; cursor: pointer;
            box-shadow: 0 6px 0 #0c2461; transition: 0.1s;
        }
        .sync-btn:active { transform: translateY(4px); box-shadow: none; }

        /* --- CATEGORY SCROLL (IMPORTANT FOR MOBILE) --- */
        .nav-scroller { 
            display: flex; gap: 10px; overflow-x: auto; padding: 5px 5px 15px 5px; 
            scrollbar-width: none; -webkit-overflow-scrolling: touch; 
        }
        .nav-scroller::-webkit-scrollbar { display: none; }
        .nav-item { 
            padding: 10px 20px; background: #fff; border-radius: 15px; 
            font-size: 1.2rem; cursor: pointer; white-space: nowrap;
            box-shadow: var(--shadow-3d); border: 2px solid transparent; transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .nav-item.active { background: var(--p-yellow); border-color: #fff; transform: translateY(-3px); }

        /* --- PRAYER TIMES LIST --- */
        .prayer-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
        .p-row { padding: 10px; background: #f8fafc; border-radius: 12px; text-align: center; box-shadow: var(--inner-glow); }
        .p-row span { display: block; font-size: 0.7rem; opacity: 0.6; }
        .p-row b { display: block; font-size: 0.9rem; color: var(--p-blue); }
        .p-row.next { background: var(--p-purple); color: #fff; }
        .p-row.next b { color: #fff; }

        /* --- DATA GRID --- */
        .grid-data { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 10px; }
        .data-card { background: #fff; border-radius: 20px; padding: 8px; border: 3px solid #fff; box-shadow: var(--shadow-3d); }
        .data-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 15px; cursor: pointer; }

        /* --- UTILS --- */
        .btn-q { padding: 8px; border-radius: 10px; border: none; color: #fff; font-size: 0.9rem; cursor: pointer; width: 100%; }

        @media (min-width: 768px) {
            .main-container { display: grid; grid-template-columns: 350px 1fr; gap: 20px; padding-top: 30px; }
            .brand-3d h1 { font-size: 2.2rem; }
            .prayer-list { grid-template-columns: 1fr; }
            .p-row { display: flex; justify-content: space-between; text-align: left; }
            .p-row span { font-size: 1.1rem; }
            .p-row b { font-size: 1.1rem; }
            .grid-data { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="brand-3d">
            <h1>SHINOBI CLOUD</h1>
        </div>

        <div class="clock-container">
            <div id="live-masa">00:00:00</div>
            <div id="live-hari">...</div>
        </div>

        <div class="auth-area">
            <button id="login-btn" class="login-btn-comp" onclick="login()">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="16"> LOGIN
            </button>
            
            <div id="profile-hub" class="profile-hub" onclick="toggleProfile()">
                <img id="u-img" class="profile-pic" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==">
                <div class="user-meta">
                    <div id="u-name" style="font-weight: bold; line-height: 1;">USER NAME</div>
                    <button style="background:none; border:none; color:red; font-size: 0.7rem; cursor:pointer;" onclick="logout()">LOGOUT</button>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- CONTROLS -->
        <aside>
            <div class="clay-card">
                <div class="section-title">📤 MUAT NAIK</div>
                <button class="sync-btn" onclick="document.getElementById('f-input').click()">✦ SYNC CLOUD <span id="p-val"></span></button>
                <input type="file" id="f-input" hidden accept="image/*,.heic">
                
                <label style="display:flex; justify-content:space-between; margin-top:15px; align-items:center; cursor:pointer;">
                    <span style="font-size:1.1rem; color:var(--p-purple);">🤖 AI BUANG BG</span>
                    <input type="checkbox" id="ai-toggle" style="width:22px; height:22px;">
                </label>
            </div>

            <div class="clay-card">
                <div class="section-title">🕌 WAKTU SOLAT</div>
                <div id="prayer-list" class="prayer-list">
                    <div class="p-row"><span>Subuh</span> <b id="p-subuh">-</b></div>
                    <div class="p-row"><span>Zohor</span> <b id="p-zohor">-</b></div>
                    <div class="p-row"><span>Asar</span> <b id="p-asar">-</b></div>
                    <div class="p-row"><span>Maghrib</span> <b id="p-maghrib">-</b></div>
                    <div class="p-row"><span>Isyak</span> <b id="p-isyak">-</b></div>
                </div>
            </div>

            <div class="clay-card">
                <div class="section-title">📖 AL-QURAN</div>
                <select id="surah-list" style="width:100%; padding:8px; border-radius:10px; margin-bottom:8px; font-size: 1rem; border:2px solid #eee;"></select>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <button class="btn-q" style="background:var(--p-green);" onclick="toggleAudio()" id="btn-play">PLAY</button>
                    <button class="btn-q" style="background:var(--p-red);" onclick="stopAudio()">STOP</button>
                </div>
                <audio id="audio-quran"></audio>
            </div>
        </aside>

        <!-- DATA -->
        <main>
            <div class="nav-scroller">
                <div class="nav-item active" onclick="setCat('Resit', this)">📜 RESIT DATA</div>
                <div class="nav-item" onclick="setCat('Logistik', this)">🚛 LOGISTIK</div>
                <div class="nav-item" onclick="setCat('Minyak', this)">⛽ MINYAK</div>
                <div class="nav-item" style="color:var(--p-purple)" onclick="setCat('Global', this)">🌎 GLOBAL</div>
            </div>

            <div id="data-grid" class="grid-data">
                <!-- Data will load here -->
            </div>
        </main>
    </div>

    <div id="modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:10001; display:none; align-items:center; justify-content:center; padding:20px;" onclick="this.style.display='none'">
        <img id="modal-img" style="max-width:100%; max-height:80vh; border:6px solid #fff; border-radius:20px; box-shadow:0 20px 40px rgba(0,0,0,0.5);">
    </div>

    <script>
        const SUPABASE_URL = 'https://wacziigqqdmfhkrycdrf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhY3ppaWdxcWRtZmhrcnljZHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNzczNTIsImV4cCI6MjA5Mjk1MzM1Mn0.TD39LvuYkM8IZF6YUDNo-LYtfIFMPrxniy_cnHnHu8A';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null, currentCat = "Resit", lastScroll = 0;

        // --- AUTH ---
        async function initAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) handleIn(session.user);
            _supabase.auth.onAuthStateChange((ev, s) => {
                if (ev === 'SIGNED_IN' && s) handleIn(s.user);
                if (ev === 'SIGNED_OUT') handleOut();
            });
        }
        function login() { _supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } }); }
        async function logout() { await _supabase.auth.signOut(); location.reload(); }
        function handleIn(u) {
            currentUser = u; document.getElementById('login-btn').style.display='none';
            document.getElementById('profile-hub').style.display='flex';
            document.getElementById('u-name').innerText = u.user_metadata.full_name;
            document.getElementById('u-img').src = u.user_metadata.avatar_url;
            fetchData();
        }
        function handleOut() { currentUser = null; document.getElementById('login-btn').style.display='flex'; document.getElementById('profile-hub').style.display='none'; }

        // --- UI ---
        function toggleProfile() { document.getElementById('profile-hub').classList.toggle('expanded'); }
        window.addEventListener('scroll', () => {
            const h = document.getElementById('main-header');
            const cur = window.pageYOffset;
            if (cur > lastScroll && cur > 60) h.classList.add('hide');
            else h.classList.remove('hide');
            lastScroll = cur;
        });

        function updateClock() {
            const now = new Date();
            const hari = ["AHAD", "ISNIN", "SELASA", "RABU", "KHAMIS", "JUMAAT", "SABTU"];
            document.getElementById('live-hari').innerText = hari[now.getDay()] + ", " + now.toLocaleDateString('ms-MY');
            document.getElementById('live-masa').innerText = now.toLocaleTimeString('ms-MY', { hour12: false });
        }
        setInterval(updateClock, 1000);

        // --- PRAYER & QURAN ---
        async function fetchPrayer() {
            const res = await fetch("https://api.azanpro.com/times/today.json?zone=sgr01&format=12");
            const data = await res.json();
            const d = data.results;
            document.getElementById('p-subuh').innerText = d.fajr;
            document.getElementById('p-zohor').innerText = d.dhuhr;
            document.getElementById('p-asar').innerText = d.asr;
            document.getElementById('p-maghrib').innerText = d.maghrib;
            document.getElementById('p-isyak').innerText = d.isha;
        }

        async function fetchQuran() {
            const res = await fetch("https://api.alquran.cloud/v1/surah");
            const data = await res.json();
            document.getElementById('surah-list').innerHTML = data.data.map(s => `<option value="${s.number}">${s.number}. ${s.englishName}</option>`).join('');
        }
        function toggleAudio() {
            const a = document.getElementById('audio-quran'), b = document.getElementById('btn-play');
            if (a.paused) { a.src = `https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${document.getElementById('surah-list').value}.mp3`; a.play(); b.innerText = "PAUSE"; }
            else { a.pause(); b.innerText = "PLAY"; }
        }
        function stopAudio() { const a = document.getElementById('audio-quran'); a.pause(); a.currentTime = 0; document.getElementById('btn-play').innerText = "PLAY"; }

        // --- DATA ---
        document.getElementById('f-input').onchange = async (e) => {
            const file = e.target.files[0]; if (!file || !currentUser) return;
            document.getElementById('p-val').innerText = "...";
            try {
                let upFile = file;
                if (document.getElementById('ai-toggle').checked) upFile = await imglyRemoveBackground(file);
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const img = new Image();
                    img.onload = async () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 1000; canvas.height = (1000/img.width)*img.height;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        await _supabase.from('uploads').insert([{ user_id: currentUser.id, category: currentCat, image_url: canvas.toDataURL('image/png', 0.7), file_name: file.name }]);
                        document.getElementById('p-val').innerText = "OK"; fetchData();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(upFile);
            } catch (err) { alert("Error"); }
        };

        async function fetchData() {
            if (!currentUser) return;
            const q = currentCat === 'Global' ? _supabase.from('uploads').select('*').eq('is_public', true) : _supabase.from('uploads').select('*').eq('user_id', currentUser.id).eq('category', currentCat);
            const { data } = await q.order('created_at', { ascending: false });
            document.getElementById('data-grid').innerHTML = (data || []).map(item => `
                <div class="data-card">
                    <img src="${item.image_url}" onclick="showModal('${item.image_url}')">
                    <div style="margin-top:8px; display:flex; gap:5px;">
                        <button style="flex:1; background:var(--p-blue); color:#fff; border:none; padding:6px; border-radius:8px; font-size:0.8rem;" onclick="showModal('${item.image_url}')">LIHAT</button>
                        ${item.user_id === currentUser.id ? `<button style="background:var(--p-red); color:#fff; border:none; padding:6px; border-radius:8px; font-size:0.8rem;" onclick="del('${item.id}')">PADAM</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function showModal(u) { document.getElementById('modal-img').src = u; document.getElementById('modal').style.display = 'flex'; }
        function del(id) { if(confirm("Padam?")) _supabase.from('uploads').delete().match({id}).then(() => fetchData()); }
        function setCat(c, btn) { currentCat = c; document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); btn.classList.add('active'); fetchData(); }

        initAuth(); updateClock(); fetchPrayer(); fetchQuran();
    </script>
</body>
</html>
