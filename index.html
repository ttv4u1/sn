<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHINOBI CLOUD | v23.0 PIXAR ULTIMATE</title>
    
    <link id="dynamic-favicon" rel="icon" type="image/png" href="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/bundle.js"></script>

    <style>
        :root {
            --p-blue: #3a91ff;
            --p-yellow: #ffd000;
            --p-red: #ff4757;
            --p-green: #2ed573;
            --p-purple: #a55eea;
            --clay-white: #ffffff;
            --shadow-3d: 12px 12px 25px #c3cbd9, -12px -12px 25px #ffffff;
            --inner-glow: inset 4px 4px 8px rgba(255,255,255,0.8), inset -4px -4px 8px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Bebas Neue', cursive !important; letter-spacing: 1.5px; }

        body { 
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); 
            color: #2f3542; min-height: 100vh; overflow-x: hidden;
            padding-top: 110px;
        }

        /* 3D RENDER ICONS */
        .i-3d { filter: drop-shadow(3px 5px 2px rgba(0,0,0,0.15)); display: inline-block; transition: 0.3s; }
        .nav-item:hover .i-3d { transform: scale(1.2) rotate(5deg); }

        /* --- AUTO-HIDE HEADER --- */
        header {
            margin: 0 2%; padding: 12px 30px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px);
            border-radius: 40px; border: 4px solid #fff;
            display: flex; align-items: center; justify-content: space-between;
            position: fixed; top: 15px; left: 0; right: 0; z-index: 1000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        header.hide { transform: translateY(-150%); }

        .brand-3d h1 { font-size: 2.4rem; color: var(--p-blue); text-shadow: 2px 2px 0px #fff; }

        /* --- USER PROFILE (FULL DETAILS & AUTOHIDE) --- */
        .profile-hub {
            display: flex; align-items: center; background: #fff; border-radius: 50px;
            padding: 5px; width: 55px; overflow: hidden; transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid var(--p-yellow); cursor: pointer; box-shadow: var(--shadow-3d);
        }
        .profile-hub.expanded { width: 320px; padding-right: 20px; }
        .profile-pic { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; flex-shrink: 0; background: #eee; }
        .user-meta { opacity: 0; transition: 0.3s; margin-left: 15px; white-space: nowrap; overflow: hidden; font-family: 'Inter', sans-serif !important; letter-spacing: 0; }
        .profile-hub.expanded .user-meta { opacity: 1; }

        /* --- 3D CLAY CARDS --- */
        .main-container { display: grid; grid-template-columns: 350px 1fr; gap: 25px; padding: 20px 4% 80px 4%; }
        .clay-card { 
            background: #fff; border-radius: 40px; padding: 25px; 
            margin-bottom: 25px; border: 5px solid #fff; 
            box-shadow: var(--shadow-3d); position: relative;
        }
        .section-title { font-size: 1.8rem; color: var(--p-blue); margin-bottom: 15px; border-bottom: 2px solid #f1f1f1; display: flex; align-items: center; }

        /* --- SYNC BUTTON --- */
        .sync-btn {
            width: 100%; padding: 20px; border-radius: 25px; border: none;
            background: linear-gradient(to bottom, #3a91ff, #1e3799);
            color: #fff; font-size: 2.2rem; cursor: pointer;
            box-shadow: 0 10px 0 #0c2461, 0 15px 30px rgba(0,0,0,0.2); transition: 0.1s;
        }
        .sync-btn:active { transform: translateY(8px); box-shadow: none; }

        /* --- NAVIGATION --- */
        .tab-scroller { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0 20px 0; scrollbar-width: none; }
        .nav-item { 
            padding: 15px 35px; background: #fff; border-radius: 25px; 
            font-size: 1.8rem; cursor: pointer; white-space: nowrap;
            box-shadow: var(--shadow-3d); border: 3px solid transparent; transition: 0.3s;
        }
        .nav-item.active { background: var(--p-yellow); border-color: #fff; transform: translateY(-5px); }

        /* --- DATA CARDS --- */
        .grid-data { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .data-card { background: #fff; border-radius: 35px; padding: 18px; border: 5px solid #fff; box-shadow: var(--shadow-3d); transition: 0.3s; }
        .data-card img { width: 100%; height: 240px; object-fit: cover; border-radius: 25px; box-shadow: var(--inner-glow); cursor: zoom-in; }

        .export-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
        .export-btn { padding: 10px; border-radius: 12px; border: none; cursor: pointer; color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        .bg-w { background: #2b579a; } .bg-x { background: #217346; } .bg-p { background: #d24726; } .bg-pr { background: #333; }

        /* --- PRAYER & UTILS --- */
        .p-row { display: flex; justify-content: space-between; padding: 12px 18px; background: #f8fafc; border-radius: 18px; margin-bottom: 8px; font-size: 1.4rem; box-shadow: var(--inner-glow); }
        .p-row.next { background: var(--p-purple); color: #fff; }

        @media (max-width: 1024px) { .main-container { grid-template-columns: 1fr; } header { width: 96%; } }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="brand-3d">
            <h1><span class="i-3d">☁️</span> SHINOBI CLOUD</h1>
        </div>

        <div style="text-align: center;">
            <div id="live-masa" style="color: var(--p-red); font-size: 1.8rem; font-weight: bold; font-family: 'JetBrains Mono', monospace !important;">00:00:00</div>
            <div id="live-hari" style="font-size: 0.8rem; opacity: 0.6;">SABTU, 2024</div>
        </div>

        <div style="display: flex; align-items: center; gap: 15px;">
            <button id="login-btn" style="background:white; color:black; border:3px solid var(--p-blue); padding:10px 25px; border-radius:50px; cursor:pointer; display:flex; align-items:center; gap:10px; font-size:1.2rem;" onclick="login()">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="22"> LOGIN
            </button>
            
            <div id="profile-hub" class="profile-hub" onclick="toggleProfile()">
                <img id="u-img" class="profile-pic" src="">
                <div class="user-meta">
                    <div id="u-name" style="font-size: 1.2rem; font-weight: bold; line-height: 1;">USER NAME</div>
                    <div id="u-email" style="font-size: 0.7rem; opacity: 0.7;">user@gmail.com</div>
                    <button style="background:none; border:none; color:red; font-size: 0.9rem; cursor:pointer; margin-top:5px;" onclick="logout()">LOGOUT SYSTEM</button>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- SIDEBAR -->
        <aside>
            <div class="clay-card">
                <div class="section-title"><span class="i-3d">📤</span> MUAT NAIK</div>
                <button class="sync-btn" onclick="document.getElementById('f-input').click()">✦ SYNC CLOUD <span id="p-val"></span></button>
                <input type="file" id="f-input" hidden accept="image/*,.heic">
                
                <div style="display:flex; justify-content:space-between; margin-top:20px; align-items:center;">
                    <div style="font-size:1.4rem; color:var(--p-purple);">🤖 AI BUANG BG</div>
                    <input type="checkbox" id="ai-toggle" style="width:30px; height:30px; cursor:pointer;">
                </div>
            </div>

            <div class="clay-card">
                <div class="section-title"><span class="i-3d">🕌</span> WAKTU SOLAT</div>
                <div id="prayer-list">
                    <div class="p-row"><span>Subuh</span> <span id="p-subuh">-</span></div>
                    <div class="p-row"><span>Zohor</span> <span id="p-zohor">-</span></div>
                    <div class="p-row"><span>Asar</span> <span id="p-asar">-</span></div>
                    <div class="p-row"><span>Maghrib</span> <span id="p-maghrib">-</span></div>
                    <div class="p-row"><span>Isyak</span> <span id="p-isyak">-</span></div>
                </div>
            </div>

            <div class="clay-card">
                <div class="section-title"><span class="i-3d">📖</span> AL-QURAN</div>
                <select id="surah-list" style="width:100%; padding:12px; border-radius:15px; margin-bottom:10px; font-size: 1.4rem; border:2px solid #eee;"></select>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <button style="background:var(--p-green); color:#fff; padding:10px; border:none; border-radius:15px; cursor:pointer; font-size:1.3rem;" onclick="toggleAudio()" id="btn-play">PLAY</button>
                    <button style="background:var(--p-red); color:#fff; padding:10px; border:none; border-radius:15px; cursor:pointer; font-size:1.3rem;" onclick="stopAudio()">STOP</button>
                </div>
                <audio id="audio-quran"></audio>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main>
            <div class="tab-scroller">
                <div class="nav-item active" onclick="setCat('Resit', this)"><span class="i-3d">📜</span> RESIT</div>
                <div class="nav-item" onclick="setCat('Logistik', this)"><span class="i-3d">🚛</span> LOGISTIK</div>
                <div class="nav-item" onclick="setCat('Minyak', this)"><span class="i-3d">⛽</span> MINYAK</div>
                <div class="nav-item" style="color:var(--p-purple)" onclick="setCat('Global', this)"><span class="i-3d">🌎</span> GLOBAL</div>
            </div>

            <div id="data-grid" class="grid-data"></div>
        </main>
    </div>

    <div id="modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:10000; display:none; align-items:center; justify-content:center;" onclick="this.style.display='none'"><img id="modal-img" style="max-width:90%; border:8px solid #fff; border-radius:30px;"></div>

    <script>
        const SUPABASE_URL = 'https://wacziigqqdmfhkrycdrf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhY3ppaWdxcWRtZmhrcnljZHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNzczNTIsImV4cCI6MjA5Mjk1MzM1Mn0.TD39LvuYkM8IZF6YUDNo-LYtfIFMPrxniy_cnHnHu8A';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null, currentCat = "Resit", lastScroll = 0;

        // --- AUTH LOGIC FIX ---
        async function initAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) handleIn(session.user);
            
            _supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session) handleIn(session.user);
                if (event === 'SIGNED_OUT') handleOut();
            });
        }

        function login() { 
            _supabase.auth.signInWithOAuth({ 
                provider: 'google', 
                options: { redirectTo: window.location.origin + window.location.pathname } 
            }); 
        }

        async function logout() { 
            await _supabase.auth.signOut(); 
            location.reload(); 
        }

        function handleIn(user) {
            currentUser = user;
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('profile-hub').style.display = 'flex';
            document.getElementById('u-name').innerText = user.user_metadata.full_name || "User";
            document.getElementById('u-email').innerText = user.email;
            document.getElementById('u-img').src = user.user_metadata.avatar_url || "";
            fetchData();
        }

        function handleOut() {
            currentUser = null;
            document.getElementById('login-btn').style.display = 'flex';
            document.getElementById('profile-hub').style.display = 'none';
            document.getElementById('data-grid').innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px;">SILA LOGIN UNTUK MELIHAT DATA</div>';
        }

        // --- UI FUNCTIONS ---
        function toggleProfile() { document.getElementById('profile-hub').classList.toggle('expanded'); }

        window.addEventListener('scroll', () => {
            const h = document.getElementById('main-header');
            const cur = window.pageYOffset;
            if (cur > lastScroll && cur > 120) h.classList.add('hide');
            else h.classList.remove('hide');
            lastScroll = cur;
        });

        function updateClock() {
            const now = new Date();
            const hari = ["AHAD", "ISNIN", "SELASA", "RABU", "KHAMIS", "JUMAAT", "SABTU"];
            document.getElementById('live-hari').innerText = hari[now.getDay()] + ", " + now.toLocaleDateString('ms-MY');
            document.getElementById('live-masa').innerText = now.toLocaleTimeString('ms-MY', { hour12: false });
        }
        setInterval(updateClock, 1000);

        // --- UTILS ---
        async function fetchQuran() {
            const res = await fetch("https://api.alquran.cloud/v1/surah");
            const data = await res.json();
            document.getElementById('surah-list').innerHTML = data.data.map(s => `<option value="${s.number}">${s.number}. ${s.englishName}</option>`).join('');
        }
        function toggleAudio() {
            const a = document.getElementById('audio-quran');
            const btn = document.getElementById('btn-play');
            if (a.paused) {
                a.src = `https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${document.getElementById('surah-list').value}.mp3`;
                a.play(); btn.innerText = "PAUSE";
            } else { a.pause(); btn.innerText = "PLAY"; }
        }
        function stopAudio() { const a = document.getElementById('audio-quran'); a.pause(); a.currentTime = 0; document.getElementById('btn-play').innerText = "PLAY"; }

        // --- DATA ---
        document.getElementById('f-input').onchange = async (e) => {
            const file = e.target.files[0]; if (!file || !currentUser) return;
            document.getElementById('p-val').innerText = "...";
            try {
                let upFile = file;
                if (document.getElementById('ai-toggle').checked) upFile = await imglyRemoveBackground(file);
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const img = new Image();
                    img.onload = async () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 1000; canvas.height = (1000/img.width)*img.height;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        await _supabase.from('uploads').insert([{ user_id: currentUser.id, category: currentCat, image_url: canvas.toDataURL('image/png', 0.7), file_name: file.name }]);
                        document.getElementById('p-val').innerText = "OK"; fetchData();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(upFile);
            } catch (err) { alert("Error"); }
        };

        async function fetchData() {
            if (!currentUser) return;
            const q = currentCat === 'Global' ? _supabase.from('uploads').select('*').eq('is_public', true) : _supabase.from('uploads').select('*').eq('user_id', currentUser.id).eq('category', currentCat);
            const { data } = await q.order('created_at', { ascending: false });
            document.getElementById('data-grid').innerHTML = data.map(item => `
                <div class="data-card">
                    <img src="${item.image_url}" onclick="window.open('${item.image_url}')">
                    <div class="export-bar">
                        <button class="export-btn bg-w" title="Word">W</button>
                        <button class="export-btn bg-x" title="Excel">X</button>
                        <button class="export-btn bg-pr" title="Print" onclick="window.print()">P</button>
                    </div>
                    ${item.user_id === currentUser.id ? `<button style="width:100%; background:var(--p-red); color:#fff; border:none; border-radius:15px; margin-top:10px; padding:8px; font-size:1.2rem; cursor:pointer;" onclick="del('${item.id}')">HAPUS</button>` : ''}
                </div>
            `).join('');
        }

        async function fetchPrayer() {
            const res = await fetch("https://api.azanpro.com/times/today.json?zone=sgr01&format=12");
            const data = await res.json();
            const d = data.results;
            document.getElementById('p-subuh').innerText = d.fajr;
            document.getElementById('p-zohor').innerText = d.dhuhr;
            document.getElementById('p-asar').innerText = d.asr;
            document.getElementById('p-maghrib').innerText = d.maghrib;
            document.getElementById('p-isyak').innerText = d.isha;
        }

        function del(id) { if(confirm("Hapus?")) _supabase.from('uploads').delete().match({id}).then(() => fetchData()); }
        function setCat(c, btn) { currentCat = c; document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); btn.classList.add('active'); fetchData(); }

        fetchQuran(); fetchPrayer(); initAuth(); updateClock();
    </script>
</body>
</html>
