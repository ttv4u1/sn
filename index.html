<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIME DASHBOARD | SHINOBI DATA v1.3.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- HEIC Converter -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <style>
        :root {
            --primary: #ff2d55;
            --accent: #ffb700;
            --white: #ffffff;
            --bg-dark: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.05);
            --glow-red: 0 0 15px rgba(255, 45, 85, 0.8);
            --doc-blue: #2b5797;
            --doc-green: #217346;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Bebas Neue', cursive; letter-spacing: 1px; }
        body { background-color: var(--bg-dark); color: var(--white); overflow-x: hidden; min-height: 100vh; }

        .animated-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(45deg, #1a0005, #000000, #0d001a); }
        .anime-overlay { position: absolute; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1578632292335-df3abbb0d586?auto=format&fit=crop&q=80&w=1920') no-repeat center center; background-size: cover; opacity: 0.1; filter: blur(2px); }

        header { position: sticky; top: 0; z-index: 1000; background: rgba(10, 10, 12, 0.8); backdrop-filter: blur(15px); border-bottom: 2px solid var(--primary); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 2rem; color: var(--primary); text-shadow: var(--glow-red); }

        .auth-container { display: flex; gap: 10px; }
        .btn-aura { padding: 10px 25px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; transition: 0.3s; font-size: 1.1rem; box-shadow: var(--glow-red); }
        .btn-aura:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--primary); }
        .btn-secondary { background: #333; box-shadow: none; }
        .hidden { display: none !important; }

        .main-container { padding: 30px 5%; display: grid; grid-template-columns: 320px 1fr; gap: 30px; }
        .side-panel { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 25px; border-radius: 15px; height: fit-content; position: sticky; top: 100px; }

        .clock-box { text-align: center; padding: 20px; border: 2px solid var(--accent); background: rgba(0,0,0,0.4); margin-bottom: 25px; clip-path: polygon(0 15%, 15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%); }
        #clock-time { font-size: 3.5rem; color: var(--accent); }

        .stat-card { background: rgba(255, 45, 85, 0.1); padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
        .stat-card h4 { font-family: 'Rajdhani', sans-serif; font-size: 0.9rem; color: #aaa; }
        .stat-card div { font-size: 1.8rem; color: #fff; }

        .upload-section { background: var(--glass); padding: 30px; border-radius: 15px; }
        .category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .cat-btn { background: #1a1a1a; border: 1px solid var(--primary); color: white; padding: 15px; cursor: pointer; transition: 0.3s; }
        .cat-btn.active { background: var(--primary); box-shadow: var(--glow-red); }

        .drop-zone { border: 2px dashed #444; padding: 40px; text-align: center; border-radius: 10px; margin-bottom: 30px; transition: 0.3s; cursor: pointer; position: relative; }
        .drop-zone:hover { border-color: var(--accent); background: rgba(255,183,0,0.05); }
        
        #loading-overlay { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); border-radius: 10px; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .item-card { background: #111; border: 1px solid #222; padding: 10px; border-radius: 8px; transition: 0.3s; display: flex; flex-direction: column; }
        .item-card:hover { border-color: var(--primary); transform: translateY(-5px); }

        .img-container { width: 100%; height: 160px; overflow: hidden; border-radius: 5px; cursor: pointer; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .doc-placeholder { font-size: 3rem; color: var(--accent); }

        .card-info { padding: 12px 5px; font-family: 'Rajdhani', sans-serif; flex-grow: 1; }
        .card-category { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; }
        .card-filename { font-size: 0.85rem; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 5px; }
        .card-date { color: #666; font-size: 0.75rem; }

        .actions { display: flex; gap: 5px; margin-top: 10px; }
        .btn-sm { flex: 1; padding: 8px; font-size: 0.8rem; border: none; cursor: pointer; color: white; transition: 0.2s; }
        .btn-view { background: #333; }
        .btn-view:hover { background: #444; }
        .btn-del { background: #500; }
        .btn-del:hover { background: #ff2d55; }

        /* Lightbox & Viewer */
        #modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #modal-content { max-width: 90%; max-height: 80vh; border: 1px solid #444; }
        #modal-img { max-width: 100%; max-height: 80vh; display: none; }
        #modal-frame { width: 80vw; height: 80vh; background: white; display: none; border: none; }
        .close-modal { position: absolute; top: 20px; right: 30px; font-size: 3rem; color: white; cursor: pointer; }

        .version-box { position: fixed; bottom: 20px; right: 20px; background: var(--primary); padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; box-shadow: var(--glow-red); z-index: 100; }

        @media (max-width: 768px) {
            .main-container { grid-template-columns: 1fr; }
            .side-panel { position: relative; top: 0; }
        }
    </style>
</head>
<body>

    <div class="animated-bg"><div class="anime-overlay"></div></div>

    <div id="modal-overlay">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <img id="modal-img" src="">
        <iframe id="modal-frame"></iframe>
        <p id="modal-name" style="margin-top: 15px; font-family: Rajdhani; color: var(--accent);"></p>
    </div>

    <header>
        <div class="logo">✦ SHINOBI DATA <span style="font-size: 0.8rem; vertical-align: middle; opacity: 0.6;">v1.3.0</span></div>
        <div class="auth-container">
            <button id="login-btn" class="btn-aura">GOOGLE LOGIN</button>
            <button id="logout-btn" class="btn-aura btn-secondary hidden">KELUAR</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="side-panel">
            <div class="clock-box">
                <div id="clock-time">00:00</div>
                <div id="clock-date" style="font-size: 0.9rem; opacity: 0.7;">LOADING...</div>
            </div>
            <div class="stat-card"><h4>JUMLAH REKOD</h4><div id="stat-total">0</div></div>
            <div class="stat-card">
                <h4>FORMAT DISOKONG</h4>
                <div style="font-size: 0.75rem; color: var(--accent); font-family: Rajdhani; line-height: 1.4;">
                    IMAGE: JPG, PNG, HEIC, WEBP, TIFF<br>
                    OFFICE: DOCX, XLSX, PPTX<br>
                    OTHERS: PDF
                </div>
            </div>
        </aside>

        <main class="upload-section">
            <h2 style="margin-bottom: 20px; color: var(--primary);">KATEGORI DATA</h2>
            <div class="category-grid">
                <button class="cat-btn active" onclick="setCategory('Resit', this)">RESIT</button>
                <button class="cat-btn" onclick="setCategory('Logistik', this)">LOGISTIK</button>
                <button class="cat-btn" onclick="setCategory('Dokumen 365', this)">DOC 365</button>
                <button class="cat-btn" onclick="setCategory('Lain-lain', this)">LAIN-LAIN</button>
            </div>

            <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <div id="loading-overlay">
                    <div class="spinner"></div>
                    <p id="loading-text" style="margin-top: 10px; font-family: Rajdhani;">MEMPROSES FAIL...</p>
                </div>
                <p id="upload-status">KLIK UNTUK MUAT NAIK FAIL (ALL FORMATS)</p>
                <input type="file" id="file-input" hidden accept="image/*,.heic,.pdf,.docx,.xlsx,.pptx">
            </div>

            <div class="data-grid" id="data-grid">
                <!-- Data Dynamically Loaded -->
            </div>
        </main>
    </div>

    <div class="version-box">v1.3.0-KAI</div>

    <script>
        const SUPABASE_URL = 'https://wacziigqqdmfhkrycdrf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhY3ppaWdxcWRtZmhrcnljZHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNzczNTIsImV4cCI6MjA5Mjk1MzM1Mn0.TD39LvuYkM8IZF6YUDNo-LYtfIFMPrxniy_cnHnHu8A';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentCategory = "Resit";

        // --- CLOCK ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').innerText = now.toLocaleTimeString('ms-MY', { hour12: false });
            document.getElementById('clock-date').innerText = now.toLocaleDateString('ms-MY', { day:'numeric', month:'long', year:'numeric' }).toUpperCase();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- AUTH ---
        _supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                currentUser = session.user;
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
                fetchData();
            } else {
                currentUser = null;
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('logout-btn').classList.add('hidden');
                document.getElementById('data-grid').innerHTML = '<p style="grid-column:1/-1; text-align:center; opacity:0.5;">SILA LOG MASUK UNTUK AKSES DATA.</p>';
            }
        });

        document.getElementById('login-btn').onclick = () => _supabase.auth.signInWithOAuth({ provider: 'google' });
        document.getElementById('logout-btn').onclick = async () => { await _supabase.auth.signOut(); window.location.reload(); };

        // --- CATEGORY ---
        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // --- UPLOAD LOGIC ---
        document.getElementById('file-input').onchange = async (e) => {
            let file = e.target.files[0];
            if (!file || !currentUser) return;

            const loadingOverlay = document.getElementById('loading-overlay');
            const loadingText = document.getElementById('loading-text');
            loadingOverlay.style.display = 'flex';

            try {
                let fileName = file.name;
                let fileData = "";

                // Handle HEIC
                if (fileName.toLowerCase().endsWith('.heic')) {
                    loadingText.innerText = "MENUKAR HEIC...";
                    const convertedBlob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.7 });
                    file = new File([convertedBlob], fileName.replace(/\.[^/.]+$/, ".jpg"), { type: "image/jpeg" });
                    fileName = file.name;
                }

                loadingText.innerText = "MENYIMPAN FAIL...";
                const reader = new FileReader();
                reader.onload = async (re) => {
                    fileData = re.target.result;
                    const { error } = await _supabase.from('uploads').insert([
                        { 
                            user_id: currentUser.id, 
                            category: currentCategory, 
                            image_url: fileData, // Menyimpan as base64
                            file_name: fileName 
                        }
                    ]);
                    
                    loadingOverlay.style.display = 'none';
                    if (error) alert("Ralat: " + error.message);
                    else fetchData();
                };
                reader.readAsDataURL(file);

            } catch (err) {
                console.error(err);
                alert("Gagal memproses fail.");
                loadingOverlay.style.display = 'none';
            }
        };

        // --- FETCH & RENDER ---
        async function fetchData() {
            if (!currentUser) return;
            const { data, error } = await _supabase.from('uploads')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (error) return;
            
            document.getElementById('stat-total').innerText = data.length;
            const grid = document.getElementById('data-grid');
            grid.innerHTML = '';

            data.forEach(item => {
                const isImage = item.image_url.startsWith('data:image/');
                const isPdf = item.image_url.startsWith('data:application/pdf');
                const ext = item.file_name ? item.file_name.split('.').pop().toLowerCase() : 'fail';
                
                let previewHtml = '';
                if (isImage) {
                    previewHtml = `<img src="${item.image_url}" loading="lazy">`;
                } else {
                    let icon = '📄';
                    if (ext === 'pdf') icon = '📕';
                    if (['docx', 'doc'].includes(ext)) icon = '📘';
                    if (['xlsx', 'xls'].includes(ext)) icon = '📗';
                    if (['pptx', 'ppt'].includes(ext)) icon = '📙';
                    previewHtml = `<div class="doc-placeholder">${icon}<div style="font-size:0.8rem; margin-top:5px;">.${ext.toUpperCase()}</div></div>`;
                }

                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="img-container" onclick="openPreview('${item.image_url}', '${item.file_name}')">
                        ${previewHtml}
                    </div>
                    <div class="card-info">
                        <div class="card-category">${item.category}</div>
                        <div class="card-filename">${item.file_name || 'Tanpa Nama'}</div>
                        <div class="card-date">${new Date(item.created_at).toLocaleString('ms-MY')}</div>
                        <div class="actions">
                            <button class="btn-sm btn-view" onclick="openPreview('${item.image_url}', '${item.file_name}')">LIHAT</button>
                            <button class="btn-sm btn-del" onclick="deleteItem('${item.id}')">PADAM</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- DELETE LOGIC ---
        async function deleteItem(id) {
            if (!confirm("Padam rekod ini selama-lamanya?")) return;

            const { error } = await _supabase
                .from('uploads')
                .delete()
                .eq('id', id)
                .eq('user_id', currentUser.id);

            if (error) alert("Gagal: " + error.message);
            else fetchData();
        }

        // --- PREVIEW / LIGHTBOX ---
        function openPreview(dataUrl, name) {
            const modal = document.getElementById('modal-overlay');
            const mImg = document.getElementById('modal-img');
            const mFrame = document.getElementById('modal-frame');
            const mName = document.getElementById('modal-name');

            mName.innerText = name;
            mImg.style.display = 'none';
            mFrame.style.display = 'none';

            if (dataUrl.startsWith('data:image/')) {
                mImg.src = dataUrl;
                mImg.style.display = 'block';
            } else {
                // PDF or Office Docs
                // Nota: Base64 Office docs tak boleh render terus dalam iframe tanpa library
                // Kita akan buka PDF dalam iframe, manakala Office dicadangkan muat turun
                if (dataUrl.includes('pdf')) {
                    mFrame.src = dataUrl;
                    mFrame.style.display = 'block';
                } else {
                    const link = document.createElement('a');
                    link.href = dataUrl;
                    link.download = name;
                    link.click();
                    alert("Fail format Office dumuat turun untuk dilihat.");
                    return;
                }
            }
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('modal-frame').src = "";
        }
    </script>
</body>
</html>
