<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIME DASHBOARD | SHINOBI DATA v1.1.0</title>
    
    <!-- Google Fonts: Bebas Neue & Rajdhani -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #ff2d55; /* Red Pink */
            --accent: #ffb700; /* Orange Gold */
            --white: #ffffff;
            --bg-dark: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.05);
            --glow-red: 0 0 15px rgba(255, 45, 85, 0.8);
            --glow-gold: 0 0 20px rgba(255, 183, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Bebas Neue', cursive;
            letter-spacing: 1px;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--white);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- BACKGROUND EFFECTS --- */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(45deg, #1a0005, #000000, #0d001a);
        }

        .anime-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1578632292335-df3abbb0d586?auto=format&fit=crop&q=80&w=1920') no-repeat center center;
            background-size: cover;
            opacity: 0.15;
            filter: saturate(1.5) blur(2px);
            animation: pulseBg 10s infinite alternate;
        }

        @keyframes pulseBg {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* --- HEADER --- */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 2px solid var(--primary);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 2rem; color: var(--primary); text-shadow: var(--glow-red); }

        /* --- AUTH & UI --- */
        .auth-container { display: flex; gap: 10px; }
        .btn-aura {
            padding: 10px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
            box-shadow: var(--glow-red);
        }
        .btn-aura:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--primary); }
        .btn-secondary { background: #333; box-shadow: none; }
        .hidden { display: none !important; }

        /* --- MAIN LAYOUT --- */
        .main-container {
            padding: 30px 5%;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }

        .side-panel {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 15px;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .clock-box {
            text-align: center;
            padding: 20px;
            border: 2px solid var(--accent);
            background: rgba(0,0,0,0.4);
            margin-bottom: 25px;
            clip-path: polygon(0 15%, 15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%);
        }

        #clock-time { font-size: 3.5rem; color: var(--accent); }

        .stat-card {
            background: rgba(255, 45, 85, 0.1);
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary);
        }

        .stat-card h4 { font-family: 'Rajdhani', sans-serif; font-size: 0.9rem; color: #aaa; }
        .stat-card div { font-size: 1.8rem; color: #fff; }

        /* --- UPLOAD & DATA --- */
        .upload-section { background: var(--glass); padding: 30px; border-radius: 15px; }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .cat-btn {
            background: #1a1a1a;
            border: 1px solid var(--primary);
            color: white;
            padding: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .cat-btn.active {
            background: var(--primary);
            box-shadow: var(--glow-red);
        }

        .drop-zone {
            border: 2px dashed #444;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 30px;
            transition: 0.3s;
            cursor: pointer;
        }

        .drop-zone:hover { border-color: var(--accent); background: rgba(255,183,0,0.05); }

        /* --- DATA GRID --- */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: #111;
            border: 1px solid #222;
            padding: 10px;
            border-radius: 8px;
            transition: 0.3s;
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

        .item-card:hover { border-color: var(--primary); transform: translateY(-5px); }

        .img-container {
            width: 100%;
            height: 180px;
            overflow: hidden;
            border-radius: 5px;
            cursor: zoom-in;
            position: relative;
        }

        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .img-container:hover img { transform: scale(1.1); }

        .card-info { padding: 12px 5px; font-family: 'Rajdhani', sans-serif; }
        .card-category { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; }
        .card-date { color: #666; font-size: 0.75rem; }

        .actions { display: flex; gap: 5px; margin-top: 10px; }
        .btn-sm { flex: 1; padding: 8px; font-size: 0.8rem; border: none; cursor: pointer; color: white; }
        .btn-view { background: #333; }
        .btn-del { background: #500; }
        .btn-del:hover { background: #ff2d55; }

        /* --- LIGHTBOX MODAL --- */
        #modal-overlay {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #modal-img { max-width: 90%; max-height: 85vh; border: 3px solid var(--white); box-shadow: 0 0 30px rgba(0,0,0,0.5); }

        .close-modal {
            position: absolute;
            top: 20px; right: 30px;
            font-size: 3rem;
            color: white;
            cursor: pointer;
        }

        /* --- VERSION BOX --- */
        .version-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            box-shadow: var(--glow-red);
            z-index: 100;
        }

        @media (max-width: 768px) {
            .main-container { grid-template-columns: 1fr; }
            .category-grid { grid-template-columns: repeat(2, 1fr); }
            header { padding: 1rem 2%; }
        }
    </style>
</head>
<body>

    <div class="animated-bg"><div class="anime-overlay"></div></div>

    <!-- Modal View -->
    <div id="modal-overlay" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img id="modal-img" src="" alt="Full View">
        <div id="modal-caption" style="position:absolute; bottom:30px; color:var(--accent); font-size:1.5rem;"></div>
    </div>

    <header>
        <div class="logo">✦ SHINOBI <span style="color:var(--white)">DATA</span></div>
        <div class="auth-container">
            <button id="login-btn" class="btn-aura">LOG MASUK GOOGLE</button>
            <button id="logout-btn" class="btn-aura btn-secondary hidden">KELUAR</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="side-panel">
            <div class="clock-box">
                <div id="clock-time">00:00</div>
                <div id="clock-date" style="font-size: 1rem; opacity: 0.7;">-- --- ----</div>
            </div>

            <h3 style="color: var(--primary); margin-bottom: 15px;">DASHBOARD STATS</h3>
            <div class="stat-card">
                <h4>JUMLAH REKOD</h4>
                <div id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <h4>BULAN INI</h4>
                <div id="stat-month">0</div>
            </div>
            <div class="stat-card" style="border-color: var(--accent);">
                <h4>KATEGORI AKTIF</h4>
                <div id="stat-cat" style="font-size: 1.2rem;">TIADA DATA</div>
            </div>
        </aside>

        <main class="upload-section">
            <h2 style="margin-bottom: 20px; color: var(--primary);">KATEGORI MUAT NAIK</h2>
            <div class="category-grid">
                <button class="cat-btn active" onclick="setCategory('Resit', this)">RESIT</button>
                <button class="cat-btn" onclick="setCategory('Kad Minyak', this)">KAD MINYAK</button>
                <button class="cat-btn" onclick="setCategory('Kad TNG', this)">KAD TNG</button>
                <button class="cat-btn" onclick="setCategory('Odometer', this)">ODOMETER</button>
            </div>

            <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <p id="upload-status" style="font-size: 1.2rem;">KLIK ATAU SERET GAMBAR UNTUK <span style="color:var(--primary)">MUAT NAIK</span></p>
                <input type="file" id="file-input" hidden accept="image/*">
            </div>

            <div class="filter-bar">
                <h2 style="color: var(--accent);">PANGKALAN DATA</h2>
                <select id="filter-select" onchange="fetchData()" style="background:#111; color:white; border:1px solid #444; padding:5px 15px;">
                    <option value="Semua">SEMUA DATA</option>
                    <option value="Resit">RESIT SAHAJA</option>
                    <option value="Kad Minyak">KAD MINYAK</option>
                    <option value="Kad TNG">KAD TNG</option>
                    <option value="Odometer">ODOMETER</option>
                </select>
            </div>

            <div class="data-grid" id="data-grid">
                <!-- Data will load here -->
            </div>
        </main>
    </div>

    <div class="version-box">VERSION v1.1.0-KAI</div>

    <script>
        // --- CONFIGURASI SUPABASE ---
        const SUPABASE_URL = 'https://wacziigqqdmfhkrycdrf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhY3ppaWdxcWRtZmhrcnljZHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNzczNTIsImV4cCI6MjA5Mjk1MzM1Mn0.TD39LvuYkM8IZF6YUDNo-LYtfIFMPrxniy_cnHnHu8A';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentCategory = "Resit";

        // --- CLOCK SYSTEM ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').innerText = now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            document.getElementById('clock-date').innerText = now.toLocaleDateString('ms-MY', { day:'numeric', month:'long', year:'numeric' }).toUpperCase();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- AUTH SYSTEM ---
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');

        loginBtn.onclick = () => _supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
        logoutBtn.onclick = () => { _supabase.auth.signOut(); window.location.reload(); };

        _supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                currentUser = session.user;
                loginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                fetchData();
            } else {
                currentUser = null;
                loginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
                document.getElementById('data-grid').innerHTML = '<p style="grid-column: 1/-1; text-align:center; opacity:0.5;">SILA LOG MASUK UNTUK AKSES DATA</p>';
            }
        });

        // --- DATABASE LOGIC ---
        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        document.getElementById('file-input').onchange = (e) => {
            const file = e.target.files[0];
            if (file) handleUpload(file);
        };

        async function handleUpload(file) {
            if (!currentUser) return alert("Sila log masuk dahulu!");
            
            document.getElementById('upload-status').innerHTML = "SEDANG MEMPROSES <span style='color:var(--accent)'>MUAT NAIK...</span>";

            const reader = new FileReader();
            reader.onload = async (e) => {
                const { error } = await _supabase.from('uploads').insert([
                    { user_id: currentUser.id, category: currentCategory, image_url: e.target.result }
                ]);

                if (error) alert("Ralat: " + error.message);
                else {
                    document.getElementById('upload-status').innerHTML = "BERJAYA! <span style='color:var(--accent)'>DATA DISIMPAN.</span>";
                    setTimeout(() => document.getElementById('upload-status').innerHTML = "KLIK ATAU SERET GAMBAR UNTUK <span style='color:var(--primary)'>MUAT NAIK</span>", 2000);
                    fetchData();
                }
            };
            reader.readAsDataURL(file);
        }

        async function fetchData() {
            if (!currentUser) return;
            const filter = document.getElementById('filter-select').value;
            
            let query = _supabase.from('uploads').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            
            if (filter !== "Semua") query = query.eq('category', filter);

            const { data, error } = await query;
            if (error) return console.error(error);

            renderGrid(data);
            updateStats(data);
        }

        function renderGrid(data) {
            const grid = document.getElementById('data-grid');
            grid.innerHTML = '';

            if (data.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; opacity:0.5;">TIADA REKOD DIJUMPA</p>';
                return;
            }

            data.forEach(item => {
                const dateStr = new Date(item.created_at).toLocaleString('ms-MY');
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="img-container" onclick="openModal('${item.image_url}', '${item.category}')">
                        <img src="${item.image_url}" loading="lazy">
                    </div>
                    <div class="card-info">
                        <div class="card-category">${item.category}</div>
                        <div class="card-date">${dateStr}</div>
                        <div class="actions">
                            <button class="btn-sm btn-view" onclick="openModal('${item.image_url}', '${item.category}')">LIHAT</button>
                            <button class="btn-sm btn-del" onclick="deleteItem('${item.id}')">PADAM</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function deleteItem(id) {
            if (!confirm("Padam data ini secara kekal?")) return;
            const { error } = await _supabase.from('uploads').delete().eq('id', id);
            if (error) alert("Gagal padam!");
            else fetchData();
        }

        // --- STATS SYSTEM ---
        function updateStats(data) {
            document.getElementById('stat-total').innerText = data.length;
            
            const thisMonth = new Date().getMonth();
            const monthlyData = data.filter(d => new Date(d.created_at).getMonth() === thisMonth);
            document.getElementById('stat-month').innerText = monthlyData.length;

            if (data.length > 0) {
                const counts = {};
                data.forEach(d => counts[d.category] = (counts[d.category] || 0) + 1);
                const topCat = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
                document.getElementById('stat-cat').innerText = topCat.toUpperCase();
            }
        }

        // --- MODAL / LIGHTBOX SYSTEM ---
        function openModal(url, cat) {
            const modal = document.getElementById('modal-overlay');
            const modalImg = document.getElementById('modal-img');
            const caption = document.getElementById('modal-caption');
            
            modalImg.src = url;
            caption.innerText = cat.toUpperCase();
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Lock scroll
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // --- MOUSE EFFECT ---
        document.addEventListener('mousemove', (e) => {
            const trail = document.createElement('div');
            trail.style.cssText = `position:fixed; width:4px; height:4px; background:var(--primary); 
                                  border-radius:50%; pointer-events:none; left:${e.clientX}px; 
                                  top:${e.clientY}px; box-shadow:0 0 10px var(--primary); z-index:9999;`;
            document.body.appendChild(trail);
            setTimeout(() => {
                trail.style.transition = '0.5s';
                trail.style.opacity = '0';
                trail.style.transform = 'scale(2)';
                setTimeout(() => trail.remove(), 500);
            }, 50);
        });
    </script>
</body>
</html>
