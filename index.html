<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINOBI DATA v1.9.0 | PROGRESSIVE UPLOAD</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <style>
        :root {
            --primary: #ff2d55;
            --accent: #ffb700;
            --white: #ffffff;
            --bg-dark: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.08);
            --glow-red: 0 0 15px rgba(255, 45, 85, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Bebas Neue', cursive; letter-spacing: 1px; }
        body { background-color: var(--bg-dark); color: var(--white); overflow-x: hidden; min-height: 100vh; }

        .animated-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; }
        .anime-overlay { position: absolute; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1618336753974-aae8e04506aa?q=80&w=1920') no-repeat center center; background-size: cover; opacity: 0.1; }

        header { position: sticky; top: 0; z-index: 1000; background: rgba(10, 10, 12, 0.95); backdrop-filter: blur(15px); border-bottom: 2px solid var(--primary); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 2rem; color: var(--primary); text-shadow: var(--glow-red); }

        .auth-container { display: flex; gap: 10px; }
        .btn-aura { padding: 10px 25px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; transition: 0.3s; font-size: 1.1rem; box-shadow: var(--glow-red); }
        .hidden { display: none !important; }

        .main-container { padding: 30px 5%; display: grid; grid-template-columns: 320px 1fr; gap: 30px; }
        .side-panel { background: var(--glass); padding: 25px; border-radius: 15px; height: fit-content; position: sticky; top: 100px; }

        .clock-box { text-align: center; padding: 20px; border: 2px solid var(--accent); background: rgba(0,0,0,0.4); margin-bottom: 25px; }
        #clock-time { font-size: 3.5rem; color: var(--accent); }

        .upload-section { background: var(--glass); padding: 30px; border-radius: 15px; }
        .category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .cat-btn { background: #1a1a1a; border: 1px solid var(--primary); color: white; padding: 15px; cursor: pointer; transition: 0.3s; }
        .cat-btn.active { background: var(--primary); box-shadow: var(--glow-red); }

        .drop-zone { border: 2px dashed #444; padding: 40px; text-align: center; border-radius: 10px; cursor: pointer; }
        
        /* PROGRESS OVERLAY */
        #loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .progress-container { width: 250px; height: 10px; background: #222; border-radius: 10px; margin-top: 20px; overflow: hidden; border: 1px solid #444; }
        #progress-bar { width: 0%; height: 100%; background: var(--primary); box-shadow: var(--glow-red); transition: 0.3s; }
        #progress-text { font-family: 'Rajdhani'; color: var(--accent); margin-top: 10px; font-size: 1.2rem; font-weight: bold; }

        .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .item-card { background: #111; border: 1px solid #222; padding: 10px; border-radius: 10px; transition: 0.3s; }
        .img-container { width: 100%; height: 150px; overflow: hidden; border-radius: 6px; cursor: pointer; background: #000; display: flex; align-items: center; justify-content: center; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }

        .card-info { padding: 8px 0; font-family: 'Rajdhani'; }
        .card-category { color: var(--accent); font-size: 0.75rem; text-transform: uppercase; }
        .card-name { font-size: 0.85rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .actions { display: flex; gap: 5px; margin-top: 10px; }
        .btn-sm { flex: 1; padding: 6px; font-size: 0.8rem; border: none; cursor: pointer; color: white; border-radius: 4px; }
        .btn-view { background: #333; }
        .btn-del { background: #500; }

        #modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.97); z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #modal-img { max-width: 95%; max-height: 85vh; }
        .close-modal { position: absolute; top: 20px; right: 30px; font-size: 3rem; color: white; cursor: pointer; }

        @media (max-width: 768px) { .main-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="animated-bg"><div class="anime-overlay"></div></div>

    <div id="loading-overlay">
        <div id="progress-text">MEMULAKAN...</div>
        <div style="font-size: 2.5rem; color: white; margin-top: 5px;"><span id="progress-num">0</span>%</div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <div id="modal-overlay">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <img id="modal-img" src="">
        <div style="margin-top: 15px; text-align: center;">
            <button id="modal-dl-btn" class="btn-aura" style="font-size:0.8rem;">MUAT TURUN</button>
        </div>
    </div>

    <header>
        <div class="logo">✦ SHINOBI DATA <span style="font-size: 0.8rem; opacity: 0.6;">v1.9.0</span></div>
        <div class="auth-container">
            <button id="login-btn" class="btn-aura">GOOGLE LOGIN</button>
            <button id="logout-btn" class="btn-aura hidden">KELUAR</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="side-panel">
            <div class="clock-box"><div id="clock-time">00:00</div></div>
            <div class="stat-card"><h4>REKOD</h4><div id="stat-total">0</div></div>
        </aside>

        <main class="upload-section">
            <div class="category-grid">
                <button class="cat-btn active" onclick="setCategory('Resit', this)">RESIT</button>
                <button class="cat-btn" onclick="setCategory('Logistik', this)">LOGISTIK</button>
                <button class="cat-btn" onclick="setCategory('Lain-lain', this)">LAIN-LAIN</button>
            </div>

            <div class="drop-zone" onclick="document.getElementById('file-input').click()">
                <p>TAP UNTUK PILIH FAIL</p>
                <input type="file" id="file-input" hidden accept="image/*,.heic,.pdf">
            </div>

            <div class="data-grid" id="data-grid"></div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://wacziigqqdmfhkrycdrf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhY3ppaWdxcWRtZmhrcnljZHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNzczNTIsImV4cCI6MjA5Mjk1MzM1Mn0.TD39LvuYkM8IZF6YUDNo-LYtfIFMPrxniy_cnHnHu8A';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentCategory = "Resit";

        async function initAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) handleLogin(session.user);
            _supabase.auth.onAuthStateChange((_, s) => { if (s) handleLogin(s.user); else handleLogout(); });
        }

        function handleLogin(u) { currentUser = u; document.getElementById('login-btn').classList.add('hidden'); document.getElementById('logout-btn').classList.remove('hidden'); fetchData(); }
        function handleLogout() { currentUser = null; document.getElementById('login-btn').classList.remove('hidden'); document.getElementById('logout-btn').classList.add('hidden'); }

        document.getElementById('login-btn').onclick = () => _supabase.auth.signInWithOAuth({ provider: 'google' });
        document.getElementById('logout-btn').onclick = async () => { await _supabase.auth.signOut(); window.location.reload(); };

        function updateProgress(percent, text) {
            document.getElementById('loading-overlay').style.display = 'flex';
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-num').innerText = Math.round(percent);
            document.getElementById('progress-text').innerText = text;
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        document.getElementById('file-input').onchange = async (e) => {
            let file = e.target.files[0];
            if (!file || !currentUser) return;

            try {
                updateProgress(10, "MEMBACA FAIL...");
                let fileName = file.name;
                let ext = fileName.split('.').pop().toLowerCase();

                // 1. TUKAR HEIC KE BLOB
                if (ext === 'heic') {
                    updateProgress(30, "MENUKAR HEIC (SILA TUNGGU)...");
                    const convertedBlob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.4 });
                    file = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                    fileName = fileName.replace(/\.[^/.]+$/, ".jpg");
                }

                // 2. RESIZE GUNA CANVAS (UTK PASTIKAN TAK CRASH SUPABASE)
                updateProgress(60, "MENGOPTIMUMKAN SAIZ...");
                const base64Data = await resizeImage(file);

                // 3. MUAT NAIK
                updateProgress(85, "MENYIMPAN KE CLOUD...");
                const { error } = await _supabase.from('uploads').insert([
                    { user_id: currentUser.id, category: currentCategory, image_url: base64Data, file_name: fileName }
                ]);

                if (error) throw error;
                updateProgress(100, "SIAP!");
                setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none'; fetchData(); }, 500);

            } catch (err) {
                console.error(err);
                alert("RALAT: " + err.message);
                document.getElementById('loading-overlay').style.display = 'none';
            }
        };

        // Fungsi Resize Imej untuk jamin kestabilan
        function resizeImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const max = 1280; // Hadkan lebar max ke 1280px

                        if (width > max) {
                            height *= max / width;
                            width = max;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6)); // Compress kualiti ke 0.6
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function fetchData() {
            if (!currentUser) return;
            const { data, error } = await _supabase.from('uploads').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            if (error) return;
            document.getElementById('stat-total').innerText = data.length;
            const grid = document.getElementById('data-grid');
            grid.innerHTML = '';
            data.forEach(item => {
                const ext = item.file_name.split('.').pop().toLowerCase();
                const isImg = ['jpg','jpeg','png','webp','gif'].includes(ext);
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="img-container" onclick="viewFile('${item.image_url}', '${item.file_name}')">
                        ${isImg ? `<img src="${item.image_url}">` : `<div style="font-size:3rem">📄</div>`}
                    </div>
                    <div class="card-info">
                        <div class="card-category">${item.category}</div>
                        <div class="card-name">${item.file_name}</div>
                        <div class="actions">
                            <button class="btn-sm btn-view" onclick="viewFile('${item.image_url}', '${item.file_name}')">LIHAT</button>
                            <button class="btn-sm btn-del" onclick="deleteItem('${item.id}')">PADAM</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function deleteItem(id) {
            if (confirm("Padam?")) {
                await _supabase.from('uploads').delete().match({ id: id, user_id: currentUser.id });
                fetchData();
            }
        }

        function viewFile(url, name) {
            document.getElementById('modal-img').src = url;
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('modal-dl-btn').onclick = () => {
                const a = document.createElement('a'); a.href = url; a.download = name; a.click();
            };
        }

        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
        function updateClock() { document.getElementById('clock-time').innerText = new Date().toLocaleTimeString('ms-MY', { hour12: false }); }
        setInterval(updateClock, 1000); updateClock();
        initAuth();
    </script>
</body>
</html>
