<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHINOBI CLOUD | v26.0 PIXAR SECURE</title>
    
    <link id="dynamic-favicon" rel="icon" type="image/png" href="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/bundle.js"></script>

    <style>
        :root {
            --p-blue: #3a91ff;
            --p-yellow: #ffd000;
            --p-red: #ff4757;
            --p-green: #2ed573;
            --p-purple: #a55eea;
            --clay-white: #ffffff;
            --shadow-3d: 10px 10px 20px #c3cbd9, -10px -10px 20px #ffffff;
            --inner-glow: inset 3px 3px 6px rgba(255,255,255,0.8), inset -3px -3px 6px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Bebas Neue', cursive !important; letter-spacing: 1.2px; -webkit-tap-highlight-color: transparent; }

        body { 
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); 
            color: #2f3542; min-height: 100vh; overflow-x: hidden; padding-top: 85px;
        }

        /* --- STABLE HEADER --- */
        header {
            padding: 10px 15px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
            border-bottom: 4px solid var(--p-blue); display: flex; align-items: center; justify-content: space-between;
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: transform 0.4s ease;
        }
        header.hide { transform: translateY(-100%); }

        .brand h1 { font-size: 1.6rem; color: var(--p-blue); text-shadow: 1px 1px 0px #fff; }

        .clock-ui { text-align: center; flex: 1; }
        #live-masa { font-family: 'JetBrains Mono', monospace !important; color: var(--p-red); font-size: 1.2rem; font-weight: bold; }
        #live-hari { font-size: 0.65rem; opacity: 0.6; text-transform: uppercase; }

        /* --- REALISTIC LOGIN BUTTON --- */
        .login-btn-3d {
            background: #fff; border: 2.5px solid var(--p-blue); padding: 8px 18px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.3s;
            box-shadow: 4px 4px 0px var(--p-blue); font-size: 1rem; color: var(--p-blue);
        }
        .login-btn-3d:active { transform: translate(3px, 3px); box-shadow: none; }
        .login-btn-3d img { width: 18px; }

        /* --- PROFILE HUB --- */
        .profile-hub {
            display: none; align-items: center; background: #fff; border-radius: 50px;
            padding: 4px; width: 50px; overflow: hidden; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid var(--p-yellow); cursor: pointer; box-shadow: var(--shadow-3d);
        }
        .profile-hub.expanded { width: 200px; padding-right: 15px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; flex-shrink: 0; background: #eee; }
        .user-details { opacity: 0; transition: 0.3s; margin-left: 10px; white-space: nowrap; overflow: hidden; font-family: 'Inter', sans-serif !important; letter-spacing: 0; }
        .profile-hub.expanded .user-details { opacity: 1; }

        /* --- LAYOUT --- */
        .main-content { padding: 15px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 20px; }

        .clay-card { 
            background: #fff; border-radius: 25px; padding: 20px; border: 4px solid #fff; 
            box-shadow: var(--shadow-3d); margin-bottom: 20px;
        }

        /* 1. SYNC CLOUD */
        .sync-area { 
            background: var(--p-blue); color: #fff; padding: 20px; border-radius: 20px;
            text-align: center; cursor: pointer; box-shadow: 0 8px 0 #0c2461; transition: 0.1s;
        }
        .sync-area:active { transform: translateY(4px); box-shadow: none; }

        /* 2. PRAYER TIMES */
        .p-item { display: flex; justify-content: space-between; padding: 10px; background: #f8fafc; border-radius: 12px; margin-bottom: 6px; box-shadow: var(--inner-glow); font-size: 1rem; }
        .p-item.active { background: var(--p-purple); color: #fff; }

        /* 3. UTILS */
        .nav-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
        .nav-item { padding: 12px 25px; background: #fff; border-radius: 15px; white-space: nowrap; cursor: pointer; box-shadow: var(--shadow-3d); border: 2px solid transparent; }
        .nav-item.active { background: var(--p-yellow); border-color: #fff; transform: translateY(-3px); }

        /* DATA GRID */
        .grid-data { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .data-card { background: #fff; border-radius: 20px; padding: 10px; border: 3px solid #fff; box-shadow: var(--shadow-3d); position: relative; }
        .data-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 15px; cursor: pointer; }

        /* MOBILE FIX */
        @media (max-width: 1024px) {
            .main-content { grid-template-columns: 1fr; }
            header { padding: 10px; }
            .brand h1 { font-size: 1.2rem; }
            .grid-data { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="brand"><h1>SHINOBI CLOUD</h1></div>
        <div class="clock-ui">
            <div id="live-masa">00:00:00</div>
            <div id="live-hari">...</div>
        </div>
        <div class="auth-area">
            <button id="login-btn" class="login-btn-3d" onclick="login()">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png"> LOGIN
            </button>
            <div id="profile-hub" class="profile-hub" onclick="toggleProfile()">
                <img id="u-img" class="avatar" src="">
                <div class="user-details">
                    <div id="u-name" style="font-weight: bold; line-height: 1;">USER</div>
                    <button style="background:none; border:none; color:red; font-size: 0.7rem; cursor:pointer;" onclick="logout()">LOGOUT</button>
                </div>
            </div>
        </div>
    </header>

    <div class="main-content">
        <!-- SIDEBAR -->
        <aside>
            <div class="clay-card">
                <div style="font-size:0.9rem; color:var(--p-blue); margin-bottom:8px;">1. SYNC DATA</div>
                <div class="sync-area" onclick="document.getElementById('f-input').click()">
                    <span style="font-size:1.6rem;">✦ SYNC CLOUD <span id="p-val"></span></span>
                </div>
                <input type="file" id="f-input" hidden accept="image/*,.heic">
                <label style="display:flex; justify-content:space-between; margin-top:15px; align-items:center; cursor:pointer;">
                    <span style="font-size:1.1rem; color:var(--p-purple);">🤖 AI BUANG BG</span>
                    <input type="checkbox" id="ai-toggle" style="width:20px; height:20px;">
                </label>
            </div>

            <div class="clay-card">
                <div style="font-size:0.9rem; color:var(--p-purple); margin-bottom:8px;">2. WAKTU SOLAT</div>
                <div id="p-list">
                    <div class="p-item"><span>Subuh</span> <b id="p-subuh">-</b></div>
                    <div class="p-item"><span>Zohor</span> <b id="p-zohor">-</b></div>
                    <div class="p-item"><span>Asar</span> <b id="p-asar">-</b></div>
                    <div class="p-item"><span>Maghrib</span> <b id="p-maghrib">-</b></div>
                    <div class="p-item"><span>Isyak</span> <b id="p-isyak">-</b></div>
                </div>
            </div>

            <div class="clay-card">
                <div style="font-size:0.9rem; color:var(--p-green); margin-bottom:8px;">3. UTILITIES</div>
                <select id="surah-list" style="width:100%; padding:8px; border-radius:10px; border:2px solid #eee; margin-bottom:8px;"></select>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <button style="background:var(--p-green); color:#fff; border:none; padding:8px; border-radius:10px; cursor:pointer;" onclick="toggleAudio()" id="btn-play">PLAY</button>
                    <button style="background:var(--p-red); color:#fff; border:none; padding:8px; border-radius:10px; cursor:pointer;" onclick="stopAudio()">STOP</button>
                </div>
                <audio id="audio-quran"></audio>
            </div>
        </aside>

        <!-- DATA -->
        <main>
            <div class="nav-scroll">
                <div class="nav-item active" onclick="setCat('Resit', this)">📜 RESIT</div>
                <div class="nav-item" onclick="setCat('Logistik', this)">🚛 LOGISTIK</div>
                <div class="nav-item" onclick="setCat('Minyak', this)">⛽ MINYAK</div>
                <div class="nav-item" style="color:var(--p-purple)" onclick="setCat('Global', this)">🌎 GLOBAL</div>
            </div>

            <div id="data-grid" class="grid-data">
                <!-- Records list -->
            </div>
        </main>
    </div>

    <div id="modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:10001; display:none; align-items:center; justify-content:center; padding:20px;" onclick="this.style.display='none'">
        <img id="modal-img" style="max-width:100%; max-height:85vh; border:6px solid #fff; border-radius:20px;">
    </div>

    <script>
        // --- CONFIG ---
        const SUPABASE_URL = 'https://wacziigqqdmfhkrycdrf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhY3ppaWdxcWRtZmhrcnljZHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNzczNTIsImV4cCI6MjA5Mjk1MzM1Mn0.TD39LvuYkM8IZF6YUDNo-LYtfIFMPrxniy_cnHnHu8A';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null, currentCat = "Resit", lastScroll = 0;

        // --- STABLE LOGIN LOGIC ---
        async function initAuth() {
            // Cek sesi sedia ada semasa page load
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) handleIn(session.user);

            // Dengar perubahan status auth (Login/Logout)
            _supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    handleIn(session.user);
                } else if (event === 'SIGNED_OUT') {
                    handleOut();
                }
            });
        }

        function login() {
            _supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + window.location.pathname,
                    queryParams: { prompt: 'select_account' }
                }
            });
        }

        async function logout() {
            await _supabase.auth.signOut();
            window.location.reload();
        }

        function handleIn(user) {
            currentUser = user;
            document.getElementById('login-btn').style.display = 'none';
            const hub = document.getElementById('profile-hub');
            hub.style.display = 'flex';
            document.getElementById('u-name').innerText = user.user_metadata.full_name || "Active User";
            document.getElementById('u-img').src = user.user_metadata.avatar_url || "";
            fetchData();
        }

        function handleOut() {
            currentUser = null;
            document.getElementById('login-btn').style.display = 'flex';
            document.getElementById('profile-hub').style.display = 'none';
            document.getElementById('data-grid').innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; font-size:1.2rem; opacity:0.5;">SILA LOGIN UNTUK AKSES DATA</div>';
        }

        // --- UI & UTILS ---
        function toggleProfile() { document.getElementById('profile-hub').classList.toggle('expanded'); }
        
        window.addEventListener('scroll', () => {
            const h = document.getElementById('main-header');
            const cur = window.pageYOffset;
            if (cur > lastScroll && cur > 80) h.classList.add('hide');
            else h.classList.remove('hide');
            lastScroll = cur;
        });

        function updateClock() {
            const now = new Date();
            const hari = ["AHAD", "ISNIN", "SELASA", "RABU", "KHAMIS", "JUMAAT", "SABTU"];
            document.getElementById('live-hari').innerText = hari[now.getDay()] + ", " + now.toLocaleDateString('ms-MY');
            document.getElementById('live-masa').innerText = now.toLocaleTimeString('ms-MY', { hour12: false });
        }
        setInterval(updateClock, 1000);

        async function fetchPrayer() {
            try {
                const res = await fetch("https://api.azanpro.com/times/today.json?zone=sgr01&format=12");
                const data = await res.json();
                const d = data.results;
                document.getElementById('p-subuh').innerText = d.fajr;
                document.getElementById('p-zohor').innerText = d.dhuhr;
                document.getElementById('p-asar').innerText = d.asr;
                document.getElementById('p-maghrib').innerText = d.maghrib;
                document.getElementById('p-isyak').innerText = d.isha;
            } catch(e) {}
        }

        async function fetchQuran() {
            const res = await fetch("https://api.alquran.cloud/v1/surah");
            const data = await res.json();
            document.getElementById('surah-list').innerHTML = data.data.map(s => `<option value="${s.number}">${s.number}. ${s.englishName}</option>`).join('');
        }
        function toggleAudio() {
            const a = document.getElementById('audio-quran'), b = document.getElementById('btn-play');
            if (a.paused) { a.src = `https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${document.getElementById('surah-list').value}.mp3`; a.play(); b.innerText = "PAUSE"; }
            else { a.pause(); b.innerText = "PLAY"; }
        }
        function stopAudio() { const a = document.getElementById('audio-quran'); a.pause(); a.currentTime = 0; document.getElementById('btn-play').innerText = "PLAY"; }

        // --- DATA HANDLER ---
        document.getElementById('f-input').onchange = async (e) => {
            const file = e.target.files[0]; if (!file || !currentUser) return;
            document.getElementById('p-val').innerText = "...";
            try {
                let upFile = file;
                if (document.getElementById('ai-toggle').checked) upFile = await imglyRemoveBackground(file);
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const img = new Image();
                    img.onload = async () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 1000; canvas.height = (1000/img.width)*img.height;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        await _supabase.from('uploads').insert([{ user_id: currentUser.id, category: currentCat, image_url: canvas.toDataURL('image/png', 0.7), file_name: file.name }]);
                        document.getElementById('p-val').innerText = "OK"; fetchData();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(upFile);
            } catch (err) { alert("Muat naik gagal."); }
        };

        async function fetchData() {
            if (!currentUser) return;
            const q = currentCat === 'Global' ? _supabase.from('uploads').select('*').eq('is_public', true) : _supabase.from('uploads').select('*').eq('user_id', currentUser.id).eq('category', currentCat);
            const { data } = await q.order('created_at', { ascending: false });
            const grid = document.getElementById('data-grid');
            if (!data || data.length === 0) { grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; opacity:0.5;">TIADA DATA DITEMUI</div>'; return; }
            grid.innerHTML = data.map(item => `
                <div class="data-card">
                    <img src="${item.image_url}" onclick="showModal('${item.image_url}')">
                    <div style="margin-top:8px; display:flex; gap:5px;">
                        <button style="flex:1; background:var(--p-blue); color:#fff; border:none; padding:8px; border-radius:10px; font-size:0.8rem; cursor:pointer;" onclick="window.open('${item.image_url}')">OPEN</button>
                        ${item.user_id === currentUser.id ? `<button style="background:var(--p-red); color:#fff; border:none; padding:8px; border-radius:10px; font-size:0.8rem; cursor:pointer;" onclick="del('${item.id}')">DEL</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function showModal(u) { document.getElementById('modal-img').src = u; document.getElementById('modal').style.display = 'flex'; }
        function del(id) { if(confirm("Padam fail?")) _supabase.from('uploads').delete().match({id}).then(() => fetchData()); }
        function setCat(c, btn) { currentCat = c; document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); btn.classList.add('active'); fetchData(); }

        // Start
        initAuth(); updateClock(); fetchPrayer(); fetchQuran();
    </script>
</body>
</html>
